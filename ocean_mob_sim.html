        vec3 sunC = sunBelowHorizon(r, muS) ? vec3(0.0) : sampleTrans(r, muS) * uSun.w * uCMisc.w;
        float od = cLightOD(p, st.y, lod);
        float hf = clamp((p.y - uCLayer.x) / (uCLayer.y - uCLayer.x), 0.0, 1.0);
        float beer = ph0 * exp(-od) + 0.5 * ph1 * exp(-od * 0.35) + 0.25 * ph2 * exp(-od * 0.12);
        float powder = mix(1.0, 1.0 - exp(-od * 1.5 - sig * 0.06), pw);
        vec3 S = sunC * (beer * powder + 0.22 / (1.0 + 0.25 * od)) + mix(ambB, ambT, hf * hf);   // + deep multiple scattering
        float a = 1.0 - exp(-sig * dt);
        L += T * S * a;
        tw += t * T * a; ws += T * a;
        T *= 1.0 - a;
      }
    }
    t += dt;
  }
  T = max(T - 0.01, 0.0) / 0.99;                       // the march stops at T < 0.008: call that opaque (sun disc)
  vec3 sky = skyAtmo(normalize(vec3(rd.x, max(rd.y, 0.0005), rd.z)));
  vec3 Ta = cAirT(rd, ws > 0.0 ? tw / ws : t0, org.y);
  sky *= mix(1.0, uCMisc.z, 0.7);
  vec4 res = vec4(L * Ta + sky * (1.0 - Ta) * (1.0 - T), T);
  // rain shafts under the storm cells, between the camera and the cloud base
  if (uCMisc.y > 0.001 && org.y < uCLayer.x && rd.y < 0.3) {
    float a0 = 2.0, a1 = min(t0, 45.0);
    if (a1 > a0) {
      float dr = (a1 - a0) / 14.0, tr = a0 + dr * jit, Tr = 1.0, trw = 0.0, wr = 0.0;
      vec3 Lr = vec3(0.0);
      vec3 rc = mix(ambB, ambT, 0.3) * 0.8;
      for (int k = 0; k < 14; k++) {
        vec3 pe = ro + rd * tr;
        float r = length(pe);
        vec3 p = vec3(pe.x + org.x, r - RG, pe.z + org.z);
        if (p.y > uCLayer.x) break;
        vec4 w = cWeather(p.xz);
        float pr = smoothstep(0.45, 0.8, w.b) * cCover(w) * uCMisc.y;
        if (pr > 0.0) {
          float sk = textureLod(uCDetail, vec3((p.x + uCWind.x) * 0.9, p.y * 0.05 + uCMisc.x * 0.01, (p.z + uCWind.y) * 0.9), 0.0).r;
          float a = 1.0 - exp(-pr * (0.15 + 0.5 * sk * sk) * dr);
          Lr += Tr * rc * a; trw += tr * Tr * a; wr += Tr * a;
          Tr *= 1.0 - a;
        }
        tr += dr;
      }
      vec3 Tra = cAirT(rd, wr > 0.0 ? trw / wr : a0, org.y);
      res = vec4(Lr * Tra + sky * (1.0 - Tra) * (1.0 - Tr) + Tr * res.rgb, Tr * res.a);
    }
  }
  return res;
}
// transmittance of the clouds along a ray toward the sun (sun readback)
float cSunTrans(vec3 org, vec3 rd) {
  if (uCLayer.z <= 0.001 || rd.y < -0.05) return 1.0;
  vec3 ro = vec3(0.0, RG + org.y, 0.0);
  float t0, t1;
  if (!cShell(ro, rd, t0, t1)) return 1.0;
  t1 = min(t1, t0 + 60.0);
  float dt = (t1 - t0) / 48.0, od = 0.0;
  for (int i = 0; i < 48; i++) {
    vec3 pe = ro + rd * (t0 + (float(i) + 0.5) * dt);
    float r = length(pe);
    vec3 p = vec3(pe.x + org.x, r - RG, pe.z + org.z);
    vec4 w = cWeather(p.xz);
    float c = cCover(w);
    if (c > 0.0) od += cDensity(p, w, c, 0.0, true) * dt;
  }
  return exp(-od * uCDens.x);
}
`;
const SKY_IGN_GLSL = 'float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }\n';

// ---- main-view march, temporal resolve, panorama
const SKY_MARCH_FRAG = ATMO_GLSL + NOISE_GLSL + SKY_FUNCS + CLOUD_GLSL + SKY_IGN_GLSL + /* glsl */`
uniform mat4 uInvVP;
uniform vec2 uRes, uJit;
uniform float uFrame;
uniform vec3 uOrg;
uniform vec4 uSteps;
layout(location = 0) out vec4 fragColor;
void main() {
  vec2 ndc = (gl_FragCoord.xy + uJit) / uRes * 2.0 - 1.0;
  vec4 pf = uInvVP * vec4(ndc, 1.0, 1.0);
  vec3 rd = normalize(pf.xyz / pf.w);
  float jit = fract(ign(gl_FragCoord.xy) + uFrame * 0.618034);
  fragColor = cMarch(uOrg, rd, jit, uSteps);
}`;
const SKY_RESOLVE_FRAG = /* glsl */`
uniform sampler2D uCur, uHist;
uniform mat4 uInvVP, uPrevVP;
uniform vec2 uRes;
uniform float uBlend;
layout(location = 0) out vec4 fragColor;
void main() {
  ivec2 ip = ivec2(gl_FragCoord.xy);
  ivec2 mx = ivec2(uRes) - 1;
  vec4 cur = texelFetch(uCur, ip, 0);
  vec4 lo = cur, hi = cur, sum = cur;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    if (x == 0 && y == 0) continue;
    vec4 c = texelFetch(uCur, clamp(ip + ivec2(x, y), ivec2(0), mx), 0);
    lo = min(lo, c); hi = max(hi, c); sum += c;
  }
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  vec4 pf = uInvVP * vec4(ndc, 1.0, 1.0);
  vec3 rd = normalize(pf.xyz / pf.w);
  vec4 pc = uPrevVP * vec4(rd, 0.0);
  vec2 puv = pc.xy / max(pc.w, 1e-6) * 0.5 + 0.5;
  bool ok = uBlend < 1.0 && pc.w > 0.0 && all(greaterThan(puv, vec2(0.0))) && all(lessThan(puv, vec2(1.0)));
  if (!ok) { fragColor = mix(cur, sum / 9.0, 0.5); return; }
  vec4 h = texture(uHist, puv);
  vec4 ext = (hi - lo) * 0.35 + vec4(vec3(0.02), 0.02);
  h = clamp(h, lo - ext, hi + ext);
  fragColor = mix(h, cur, uBlend);
}`;
// one horizontal strip of the panorama (rows uY0..), blended with the previous panorama in the shader
const SKY_PANO_FRAG = ATMO_GLSL + NOISE_GLSL + SKY_FUNCS + CLOUD_GLSL + SKY_IGN_GLSL + /* glsl */`
uniform sampler2D uHist;
uniform vec2 uRes;
uniform float uFrame, uY0, uBlend;
uniform vec3 uOrg;
uniform vec4 uSteps;
layout(location = 0) out vec4 fragColor;
void main() {
  vec2 px = vec2(gl_FragCoord.x, gl_FragCoord.y + uY0);
  vec2 uv = px / uRes;
  float az = (uv.x - 0.5) * 2.0 * PI;
  float el = uv.y * uv.y * 0.5 * PI;
  vec3 rd = vec3(cos(el) * cos(az), sin(el), cos(el) * sin(az));
  float jit = fract(ign(px) + uFrame * 0.618034);
  vec4 c = cMarch(uOrg, rd, jit, uSteps);
  fragColor = uBlend < 1.0 ? mix(texelFetch(uHist, ivec2(px), 0), c, uBlend) : c;
}`;
const SKY_COPY_FRAG = /* glsl */`
uniform sampler2D uSrc;
uniform float uY0;
layout(location = 0) out vec4 fragColor;
void main() { fragColor = texelFetch(uSrc, ivec2(gl_FragCoord.x, gl_FragCoord.y - uY0), 0); }`;

const skyCloud = {
  w: 0, h: 0, div: 0, q: -1, frame: 0, hist: 0, histOK: false, panoW: 0, panoH: 0, panoStrip: 0, panoFresh: 0,
  march: null, histA: null, histB: null, pano: null,
  vp: new THREE.Matrix4(), prevVP: new THREE.Matrix4(), invVP: new THREE.Matrix4(), rot: new THREE.Matrix4(),
  driftX: 0, driftZ: 0,
};
const skyMarchMat = passMat(SKY_MARCH_FRAG, {
  ...skyU, uInvVP: { value: new THREE.Matrix4() }, uRes: { value: new THREE.Vector2() }, uJit: { value: new THREE.Vector2() },
  uFrame: { value: 0 }, uOrg: { value: new THREE.Vector3() }, uSteps: { value: new THREE.Vector4(64, 6, 100, 0.002) },
});
const skyResolveMat = passMat(SKY_RESOLVE_FRAG, {
  uCur: { value: null }, uHist: { value: null }, uInvVP: { value: new THREE.Matrix4() }, uPrevVP: { value: new THREE.Matrix4() },
  uRes: { value: new THREE.Vector2() }, uBlend: { value: 1 },
});
const skyPanoMat = passMat(SKY_PANO_FRAG, {
  ...skyU, uHist: { value: null }, uRes: { value: new THREE.Vector2() }, uFrame: { value: 0 }, uY0: { value: 0 }, uBlend: { value: 1 },
  uOrg: { value: new THREE.Vector3() }, uSteps: { value: new THREE.Vector4(40, 5, 90, 0.006) },
});
const skyCopyMat = passMat(SKY_COPY_FRAG, { uSrc: { value: null }, uY0: { value: 0 } });

// quality presets: [resolution divisor, primary steps, light steps, max distance km, panorama w, h, panorama steps]
const SKY_Q = [[4, 36, 4, 60, 512, 128, 28], [3, 44, 5, 80, 512, 128, 32], [2, 52, 5, 100, 1024, 256, 40], [2, 80, 6, 120, 1024, 256, 52]];
function skyCloudTargets() {
  const q = clamp(Math.round(params.quality ?? 2), 0, 3), Q = SKY_Q[q];
  const w = Math.max(16, Math.ceil(drawSize.x / Q[0])), h = Math.max(16, Math.ceil(drawSize.y / Q[0]));
  if (q !== skyCloud.q || w !== skyCloud.w || h !== skyCloud.h) {
    const mk = () => target(w, h);
    for (const k of ['march', 'histA', 'histB']) { if (skyCloud[k]) skyCloud[k].dispose(); skyCloud[k] = mk(); }
    skyCloud.march.texture.minFilter = skyCloud.march.texture.magFilter = THREE.NearestFilter;
    Object.assign(skyCloud, { w, h, div: Q[0], histOK: false });
  }
  if (Q[4] !== skyCloud.panoW) {
    if (skyCloud.pano) { skyCloud.pano.dispose(); skyCloud.panoStripRT.dispose(); }
    skyCloud.pano = target(Q[4], Q[5], { wrapS: THREE.RepeatWrapping });
    skyCloud.panoStripRT = target(Q[4], Q[5] / 4, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
    renderer.setRenderTarget(skyCloud.pano); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.setRenderTarget(null);
    Object.assign(skyCloud, { panoW: Q[4], panoH: Q[5], panoStrip: 0, panoFresh: 0 });
    skyU.uCloudPano.value = skyCloud.pano.texture;
  }
  skyCloud.q = q;
  return Q;
}
skyCloudTargets();
skyU.uCloudScr.value = skyCloud.histA.texture;
const SKY_HALTON = [[0.5, 0.333], [0.25, 0.667], [0.75, 0.111], [0.125, 0.444], [0.625, 0.778], [0.375, 0.222], [0.875, 0.556], [0.0625, 0.889]];

function skyCloudUniforms(dt) {
  const U = skyU;
  const base = params.cloudBase, top = base + Math.max(params.cloudThick, 0.2);
  U.uCLayer.value.set(base, top, params.volClouds ? params.clouds : 0, params.cloudType);
  U.uCDens.value.x = 60 * params.cloudDensity;
  U.uCDens.value.y = 0.35 * params.cloudDetail;
  // clouds drift with the gradient wind (~1.6x the surface wind + 3 m/s) toward the downwind direction
  const [tx, tz] = bearingVec(params.windFrom + 180);
  const v = (params.windSpeed * 1.6 + 3) * params.cloudDrift * 1e-3;     // km/s
  skyCloud.driftX -= tx * v * dt; skyCloud.driftZ -= tz * v * dt;
  skyCloud.driftX %= 40 * 55; skyCloud.driftZ %= 40 * 55;            // keep the offset small (weather tile x shape tile)
  U.uCWind.value.set(skyCloud.driftX, skyCloud.driftZ, -tx, -tz);
  U.uCMisc.value.x = (U.uCMisc.value.x + dt * params.cloudDrift) % 2e4;
  U.uCMisc.value.y = params.rainShafts;
  // skylight under the cloud deck: open sky in the gaps + diffuse transmission (two-stream ~1/(1 + 0.15 tau)) of the
  // vertical optical depth; scales the ambient of the clouds, the haze in front of them and the sea fog
  const cov = params.volClouds ? clamp(params.clouds, 0, 1) : 0;
  const tau = 60 * params.cloudDensity * Math.max(params.cloudThick, 0.2) * 0.3 * cov;
  U.uCMisc.value.z = (1 - cov) + cov / (1 + 0.15 * tau);
  U.uCloudOn.value = params.volClouds ? 1 : 0;
}
HOOKS.lateUpdate.push(dt => skyCloudUniforms(dt));     // after the weather blend of this frame

function skyRenderClouds() {
  const Q = skyCloudTargets();
  if (!params.volClouds) return;
  const C = skyCloud;
  C.frame++;
  camera.updateMatrixWorld();
  C.rot.copy(camera.matrixWorldInverse).setPosition(0, 0, 0);
  C.vp.multiplyMatrices(camera.projectionMatrix, C.rot);
  // 1. march (jittered)
  const mu = skyMarchMat.uniforms, hj = SKY_HALTON[C.frame % 8];
  mu.uInvVP.value.copy(C.vp).invert();
  mu.uRes.value.set(C.w, C.h);
  mu.uJit.value.set(hj[0] - 0.5, hj[1] - 0.5);
  mu.uFrame.value = C.frame % 997;
  mu.uOrg.value.set(camera.position.x * 1e-3, Math.max(camera.position.y, 0) * 1e-3 + 0.002, camera.position.z * 1e-3);
  const pixAng = 2 * Math.tan(camera.fov * D2R / 2) / C.h;
  mu.uSteps.value.set(Q[1], Q[2], Q[3], pixAng);
  runPass(skyMarchMat, C.march);
  // 2. temporal resolve into the other history buffer
  const src = C.hist ? C.histB : C.histA, dst = C.hist ? C.histA : C.histB;
  const ru = skyResolveMat.uniforms;
  ru.uCur.value = C.march.texture; ru.uHist.value = src.texture;
  ru.uInvVP.value.copy(mu.uInvVP.value);
  ru.uPrevVP.value.copy(C.prevVP);
  ru.uRes.value.set(C.w, C.h);
  ru.uBlend.value = C.histOK ? 0.1 : 1.0;
  runPass(skyResolveMat, dst);
  C.hist ^= 1; C.histOK = true;
  C.prevVP.copy(C.vp);
  skyU.uCloudScr.value = dst.texture;
  skyU.uCloudVP.value.copy(C.vp);
  skyU.uCloudCamXZ.value.set(camera.position.x, camera.position.z);
  // 3. one strip of the panorama per frame (4 strips per refresh); all of it after a reset
  const pu = skyPanoMat.uniforms, strips = 4, sh = C.panoH / strips;
  pu.uRes.value.set(C.panoW, C.panoH);
  pu.uFrame.value = C.frame % 997;
  pu.uOrg.value.set(controls.target.x * 1e-3, 0.002, controls.target.z * 1e-3);
  pu.uSteps.value.set(Q[6], Math.min(Q[2], 5), Q[3], 2 * Math.PI / C.panoW);
  pu.uHist.value = C.pano.texture;
  pu.uBlend.value = C.panoFresh < strips ? 1 : 0.35;
  skyCopyMat.uniforms.uSrc.value = C.panoStripRT.texture;
  for (let k = 0, n = C.panoFresh === 0 ? strips : 1; k < n; k++) {
    const y0 = C.panoStrip * sh;
    pu.uY0.value = y0;
    runPass(skyPanoMat, C.panoStripRT);
    skyCopyMat.uniforms.uY0.value = y0;
    C.pano.scissor.set(0, y0, C.panoW, sh);
    C.pano.scissorTest = true;
    runPass(skyCopyMat, C.pano);
    C.pano.scissorTest = false;
    C.panoStrip = (C.panoStrip + 1) % strips;
    C.panoFresh++;
  }
  renderer.setRenderTarget(null);
}
HOOKS.beforeRender.push(skyRenderClouds);
HOOKS.resize.push(() => { skyCloudTargets(); });

const SKY_CLOUD_DECL = /* glsl */`
uniform sampler2D uCloudScr, uCloudPano;
uniform mat4 uCloudVP;
uniform vec2 uCloudCamXZ;
uniform float uCloudOn;
uniform vec4 uLtn;

vec2 cloudPanoUV(vec3 d) {

  float u = atan(hd.y, hd.x) * (0.5 / PI) + 0.5;

}
vec4 volCloud(vec3 d) {
#ifdef ENV_PASS
  return textureLod(uCloudPano, cloudPanoUV(d), 0.0);
#else
  // main camera (and the sensor windows when they follow it): screen-space clouds; anything else: panorama
  vec4 c = uCloudVP * vec4(d, 0.0);
  vec2 suv = c.xy / max(c.w, 1e-6) * 0.5 + 0.5;

vec3 seaFogColor(vec3 dir) {

const SKY_FINAL_HOOK = /* glsl */`
#ifndef ENV_PASS
  if (uLtn.w > 0.0 && dir.y > -0.002) {

// core hook markers may carry a trailing note on the same line: end the inserted code with a comment opener

for (const m of [skyMat, skyEnv.material]) {

// ============================================================================
// Crepuscular rays / god rays (feature module "sky")
// ============================================================================
// Screen-space light shafts: a bright-pass of the HDR frame restricted to the sky (sun disc, sunlit cloud edges and
// the gaps between clouds; people and the sea occlude it), radially blurred toward the sun at 1/2..1/4 resolution in

  uUwInfo: { value: new THREE.Vector4(0, 0, 0, 0.3) },

  uUwSigS: { value: new THREE.Vector3(0.04, 0.05, 0.06) },   // scattering coefficient (1/m)
  uUwKd: { value: new THREE.Vector3(0.46, 0.08, 0.06) },     // diffuse attenuation of downwelling light (1/m)

// Inherent optical properties of the water column (moderately clear oceanic water, Jerlov II-ish)
function uwUpdateOptics() {
  const t = params.turbidity, k = 1 / Math.max(params.uwClarity, 0.05);
  const wc = new THREE.Color(params.waterColor);
  const tint = [wc.r / UW_WATER0.r, wc.g / UW_WATER0.g, wc.b / UW_WATER0.b].map(v => clamp(v, 0.2, 3));
  const a = [0.43 + 0.03 * t, 0.055 + 0.02 * t, 0.035 + 0.035 * t];         // pure water + CDOM/particles
  const b = [0.028 * t * tint[0], 0.05 * t * tint[1], 0.058 * t * tint[2]]; // particle scattering
  uwU.uUwSigS.value.set(b[0] * k, b[1] * k, b[2] * k);
  uwU.uUwSigT.value.set((a[0] + b[0]) * k, (a[1] + b[1]) * k, (a[2] + b[2]) * k);

  uwU.uUwKd.value.set(...a.map((v, i) => Math.min((v + 0.02 * b[i]) / 0.85 * k, 0.92 * (v + b[i]) * k)));

// sun direction refracted into the water and the beam irradiance just below the surface
function uwUpdateSun() {

  const hl = Math.hypot(L.x, L.z) || 1;
  uwU.uUwSunW.value.set(L.x / hl * st, ct, L.z / hl * st);
  // Fresnel loss at the air-water interface (Schlick on the air side); beam compression cos(i)/cos(t)
  const F = 0.02 + 0.98 * Math.pow(1 - ci, 5);
  const E = oceanU.uSunE.value, up = L.y > 0 ? (1 - F) * ci / ct : 0;
  uwU.uUwSunE.value.set(E.x * up, E.y * up, E.z * up);
  uwU.uUwSunT.value = up;

// camera-local water plane from the camera probe (sampled at this frame's time, at last frame's camera xz)
function uwUpdatePlane() {
  const s = probe(CAM_PROBE), qx = queryData[CAM_PROBE * 4], qz = queryData[CAM_PROBE * 4 + 1];

  UW.mode = !params.uwAllowUnder ? 0 : UW.camS < -band ? 1 : UW.camS < band ? 2 : 0;
}

// Search-and-rescue gear in the water: lifebuoy (SOLAS light, grab line, retroreflective tape), canopied life

function uwMakeBody(o) {

    qx: o.probes.map(() => 0), qz: o.probes.map(() => 0), ps: [], ready: 0, sub: 0, added: 0, cAng: 1, visible: true,

// ---- rope festoons (grab lines) hanging between attachment points around a ring
function uwFestoon(R, y, n, sag, rad, mat, a0 = 0) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const pts = [];
    for (let k = 0; k <= 12; k++) {
      const t = k / 12, a = a0 + (i + t) / n * Math.PI * 2, s = Math.sin(Math.PI * t);
      pts.push(new THREE.Vector3((R + sag * 0.6 * s) * Math.cos(a), y - sag * s, (R + sag * 0.6 * s) * Math.sin(a)));
    }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, rad, 5), mat));
  }
  return g;
}

// ---- rescue vessel on the horizon: low-poly 26 m patrol / rescue boat, kinematic, pitching and rolling on the swell
function uwHullGeometry(L, Bm, D) {
  const g = new THREE.BoxGeometry(L, D, Bm, 28, 6, 8);
  const pos = g.attributes.position, col = [];
  const cTop = new THREE.Color(0xb3301c), cBoot = new THREE.Color(0x141414), cBottom = new THREE.Color(0x5a1a14), cRub = new THREE.Color(0x1d1f22);
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const u = x / L + 0.5, yb = (y + D / 2) / D;
    const plan = u > 0.5 ? Math.sqrt(Math.max(0, 1 - ((u - 0.5) / 0.5) ** 1.8)) : 1 - 0.1 * ((0.5 - u) / 0.5) ** 2;
    const sec = 0.22 + 0.78 * Math.pow(yb, 0.45);            // deadrise: V-shaped below, flared above
    z *= plan * sec;
    y += 0.9 * u * u * yb;                                    // sheer rises forward
    y += D * 0.75 * Math.max(0, (u - 0.62) / 0.38) ** 2 * (1 - yb);   // forefoot
    pos.setXYZ(i, x, y, z);
    const c = y > D / 2 - 0.25 ? cRub : y > 0.35 ? cTop : y > -0.15 ? cBoot : cBottom;
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

  if (!uwGearPlaced && people.length) { uwRegroupGear(); uwGearPlaced = true; uwGearFrames = 0; }
  // read this frame's probe samples (queried last frame)

  uwGearPhys += dt;

          + 0.02398 * (f4 - ring4(p, 4, 0))
          + 0.02483 * (f4 - ring4(p, 3, 3))
          + 0.02069 * (f4 - ring4(p, 16, 0))
          + 0.01674 * (f4 - ring4(p, 11, 11));
  vec2 fp = gl_FragCoord.xy;
  vec2 eu = min(fp, vec2(uRes) - fp) / uRes;
  float sponge = 1.0 - smoothstep(0.0, 0.11, min(eu.x, eu.y));
  float beta = uDamp + 7.0 * sponge * sponge;
  float v = c.g, T = c.b;
  float acc = -uGrav * K / uTexel;
  float tIn = 0.0;
  for (int i = 0; i < MAXS; i++) {
    if (i >= uSrcN) break;
    vec4 A = uSrcA[i], B = uSrcB[i];
    vec2 d = (fp - A.xy) / A.z;
    float r2 = dot(d, d);
    if (r2 > 30.0) continue;
    float G = exp(-r2);
    // volume-conserving heave source (pushed down in the footprint, up in the ring around it), the body
    // holding the surface inside its footprint, and a bow/stern dipole for motion through the water
    float F = G - 0.25 * exp(-0.25 * r2);
    acc += B.z * (5.0 * F * A.w - G * v + uDipole * G * dot(B.xy, d));
    tIn += B.w * G;
  }

  // wake and from around hands); spatially smooth over ~3 texels, white in time
  acc += uChurn * min(T + tIn * 0.5, 2.0) * gnoise(fp * 0.33 + uSeed);
  v += acc * uDt;

  v += 0.004 * (e.g + w.g + n.g + s.g - 4.0 * v);
  v -= texelFetch(uImpact, p, 0).r;
  v *= exp(-beta * uDt);
  float h = (h0 + v * uDt) * exp(-(0.08 + 2.0 * sponge) * uDt);
  T = T * exp(-uDt / uTurbTau) + tIn * uDt;
  T += 0.06 * (e.b + w.b + n.b + s.b - 4.0 * T);
  T = clamp(T * (1.0 - sponge), 0.0, 3.0);

  float a = 0.0;
  for (int i = 0; i < MAXB; i++) {
    if (i >= uBodN) break;
    vec4 A = uBodA[i], B = uBodB[i];
    vec2 ab = A.zw - A.xy;
    float t = clamp(dot(fp - A.xy, ab) / max(dot(ab, ab), 1e-4), 0.0, 1.0);
    float dd = (length(fp - A.xy - ab * t) - B.x) * uTexel;     // metres outside the waterline outline
    if (dd > 1.4) continue;
    float lip = dd + 0.02;
    float tr = dd - 0.22;
    a += B.y * exp(-lip * lip / 0.0036) - B.z * exp(-tr * tr / 0.045);
  }
  fragColor = vec4(inside ? h : 0.0, inside ? v : 0.0, T, a);
}`;

// height + static shape -> (height, slope x, slope z, turbulence), faded to zero at the domain edge
const WATER_RIP_COMPOSE_FRAG = /* glsl */`
precision highp float;
uniform sampler2D uState;
uniform float uRes, uTexel, uGain;
layout(location = 0) out vec4 fragColor;
float fadeAt(vec2 c) {
  vec2 f = (c + 0.5) / uRes;
  float e = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  return smoothstep(0.015, 0.13, e);
}
float H(ivec2 c) {
  c = clamp(c, ivec2(0), ivec2(int(uRes) - 1));
  vec4 s = texelFetch(uState, c, 0);
  return (s.r + s.a) * fadeAt(vec2(c)) * uGain;
}
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  float h = H(p);
  float sx = (H(p + ivec2(1, 0)) - H(p - ivec2(1, 0))) / (2.0 * uTexel);
  float sz = (H(p + ivec2(0, 1)) - H(p - ivec2(0, 1))) / (2.0 * uTexel);
  float T = texelFetch(uState, p, 0).b * fadeAt(vec2(p));

// droplet impacts (from the spray system) splatted into the grid as small downward velocity impulses
const WATER_IMPACT_CLEAR = new THREE.Color(0, 0, 0);

const water = {
  q: -1, n: 0, texel: 0, size: 0,
  stateA: null, stateB: null, out: null, impact: null,
  center: new THREE.Vector2(),          // grid centre in the drifting-water frame (whole texels)
  drift: { x: 0, z: 0 },                // integrated surface current (m), float64
  shift: new THREE.Vector2(),
  ready: false, steps: 0,
  per: new Map(),                       // per-person state (previous hand positions, cooldowns ...)
  srcA: Array.from({ length: WATER_MAXS }, () => new THREE.Vector4()),
  srcB: Array.from({ length: WATER_MAXS }, () => new THREE.Vector4()),

  uRes: { value: 1 }, uTexel: { value: 0.1 }, uDt: { value: 0 }, uGrav: { value: G }, uDamp: { value: 0.06 },
  uTurbTau: { value: 7 }, uDipole: { value: 4.5 }, uChurn: { value: 8 }, uSeed: { value: new THREE.Vector2() },
  uSrcA: { value: water.srcA }, uSrcB: { value: water.srcB }, uSrcN: { value: 0 },
  uBodA: { value: Array.from({ length: MAX_PEOPLE }, () => new THREE.Vector4()) },
  uBodB: { value: Array.from({ length: MAX_PEOPLE }, () => new THREE.Vector4()) }, uBodN: { value: 0 },

const waterComposeMat = passMat(WATER_RIP_COMPOSE_FRAG, { uState: { value: null }, uRes: { value: 1 }, uTexel: { value: 0.1 }, uGain: { value: 1 } });

function waterAllocRipples() {
  const q = clamp(Math.round(params.quality ?? 2), 0, 3);
  if (q === water.q) return;
  for (const k of ['stateA', 'stateB', 'out', 'impact']) if (water[k]) water[k].dispose();
  const { n, texel } = WATER_RIP_Q[q];
  Object.assign(water, { q, n, texel, size: n * texel });
  const st = { type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter };
  water.stateA = target(n, n, st);
  water.stateB = target(n, n, st);
  water.out = target(n, n, { minFilter: THREE.LinearMipmapLinearFilter, generateMipmaps: true, anisotropy: 4 });
  water.impact = target(n, n, { format: THREE.RedFormat, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const save = renderer.getClearColor(new THREE.Color()), saveA = renderer.getClearAlpha();

  renderer.setRenderTarget(null);
  renderer.setClearColor(save, saveA);
  waterSimMat.uniforms.uRes.value = waterComposeMat.uniforms.uRes.value = n;
  waterSimMat.uniforms.uTexel.value = waterComposeMat.uniforms.uTexel.value = texel;

waterAllocRipples();

// ---- ocean shader: ripple displacement (vertex), slope + roughness (fragment), turbulence micro-foam
// (the trailing '//' swallows the rest of the marker's comment line, whatever order the features inject in)
const waterInject = (hook, code, stage) => injectShader(ocean.material, hook, code + '\n//', stage);
Object.assign(oceanU, {
  uWrTex: { value: water.out.texture },
  uWrXf: { value: new THREE.Vector4(0, 0, water.size, water.texel) },   // lagrangian centre x, z, size, texel
  uWrOn: { value: 1 },
  uWrP: { value: new THREE.Vector4(1, 1, 1, 0) },                      // on, micro-foam, roughness, -

waterInject('ocean-vert-decl', 'uniform sampler2D uWrTex;\nuniform vec4 uWrXf;\nuniform float uWrOn;', 'vertex');
waterInject('ocean-vert-displace', /* glsl */`
  if (uWrOn > 0.5) {
    vec2 wrUv = (xz - uWrXf.xy) / uWrXf.z + 0.5;
    if (max(abs(wrUv.x - 0.5), abs(wrUv.y - 0.5)) < 0.5) disp.y += textureLod(uWrTex, wrUv, log2(max(spacing / uWrXf.w, 1.0))).r;
  }`, 'vertex');
waterInject('ocean-frag-decl', 'uniform sampler2D uWrTex;\nuniform vec4 uWrXf;\nuniform vec4 uWrP;');
waterInject('ocean-frag-slopes', /* glsl */`
  vec2 wrUv = (xz - uWrXf.xy) / uWrXf.z + 0.5;
  vec4 wrR = texture(uWrTex, wrUv) * (uWrP.x * step(max(abs(wrUv.x - 0.5), abs(wrUv.y - 0.5)), 0.5));
  s += wrR.yz;

waterInject('ocean-frag-foam', /* glsl */`
  if (uWrP.y > 0.0) {
    // turbulence micro-foam: lacy bubble patches where hands and bodies churn the water, fine bubbles at the edges
    float wrT = clamp(wrR.w * uWrP.y, 0.0, 2.0);
    float wrLace = texture(uFoamTex, xz * 0.62 + vec2(0.71, 0.29) + uTime * vec2(0.0021, -0.0013)).r;
    float wrFine = texture(uFoamTex, xz * 1.9 + vec2(0.31, 0.17)).g;
    float wrPat = wrLace * 0.55 + wrFine * 0.45;
    float wrCv = clamp(wrT * 0.7, 0.0, 0.75);
    float wrFw = fwidth(wrPat) + 0.05;
    float wrM = smoothstep(1.0 - wrCv - wrFw, 1.0 - wrCv + wrFw, wrPat) * smoothstep(0.03, 0.35, wrT);

  }`);

// ---- per-frame update
const _wv = new THREE.Vector3(), _wv2 = new THREE.Vector3();
const WATER_HANDS = ['LeftHand', 'RightHand'];
const WATER_FOREARM_PROBE = { LeftHand: 9, RightHand: 10 };
function waterPerson(P) {
  let s = water.per.get(P);
  if (!s) {
    s = { hands: WATER_HANDS.map(n => ({ bone: P.rig.byName(n), prev: new THREE.Vector3(), has: false, prevD: 0, drip: 0 })),
      slapCool: rand(1, 3), wRelF: 0, wMean: 0 };
    water.per.set(P, s);
  }
  return s;
}
function waterAddSource(tx, ty, rTex, wRel, ux, uz, couple, turb) {
  if (water.srcN >= WATER_MAXS) return;
  const i = water.srcN++;
  water.srcA[i].set(tx, ty, rTex, wRel);
  water.srcB[i].set(ux, uz, couple, turb);
}
// drifting-water-frame position (m) -> grid texel coordinates (continuous; texel centres at i + 0.5)
const waterTexX = x => (x - water.center.x) / water.texel + water.n / 2;
const waterTexZ = z => (z - water.center.y) / water.texel + water.n / 2;

function waterUpdate(dt) {
  waterAllocRipples();
  const on = params.waterRipples;
  oceanU.uWrOn.value = on ? 1 : 0;
  oceanU.uWrP.value.set(on ? 1 : 0, on ? params.waterMicroFoam : 0, 1, 0);
  water.events.length = 0;
  if (dt <= 0) return;
  // the drifting-water frame moves with the surface current
  water.drift.x += sea.current.x * dt; water.drift.z += sea.current.z * dt;

  // grid centre: lagrangian centroid of the people (neck probes), recentred in whole texels with hysteresis
  let cx = 0, cz = 0, cnt = 0;
  people.forEach((P, i) => { const pr = probe(i * PROBES_PER + 1); cx += pr.x0; cz += pr.z0; cnt++; });
  if (cnt) { cx /= cnt; cz /= cnt; } else { cx = controls.target.x; cz = controls.target.z; }
  cx -= water.drift.x; cz -= water.drift.z;
  water.shift.set(0, 0);
  if (!water.ready || Math.abs(cx - water.center.x) > 0.12 * water.size || Math.abs(cz - water.center.y) > 0.12 * water.size) {
    const nx = Math.round(cx / water.texel) * water.texel, nz = Math.round(cz / water.texel) * water.texel;
    if (water.ready) water.shift.set(Math.round((nx - water.center.x) / water.texel), Math.round((nz - water.center.y) / water.texel));
    else water.shift.set(1e5, 1e5);    // first step: start from a flat field
    water.center.set(nx, nz);
    water.ready = true;
  }
  if (!on) { water.ready = false; return; }

  // ---- forcing from the people
  water.srcN = 0;
  const bodA = waterSimMat.uniforms.uBodA.value, bodB = waterSimMat.uniforms.uBodB.value;
  const tx = water.texel, gain = params.waterRippleGain, wake = params.waterWake;
  let nb = 0;
  people.forEach((P, i) => {
    const S = waterPerson(P), base = i * PROBES_PER;
    const pN = probe(base + 1), pC = probe(base + 2), sc = probe(base + PROBES_PER - 1);
    // world -> drifting-water frame: subtract the local horizontal wave displacement and the drift
    const dX = P.probes[1].sx0 - pN.x0, dZ = P.probes[1].sz0 - pN.z0;
    const toTX = x => waterTexX(x - dX - water.drift.x), toTZ = z => waterTexZ(z - dZ - water.drift.z);
    const wRaw = P.vel.y - sc.vy;                                           // heave relative to the surface
    S.wMean += (wRaw - S.wMean) * (1 - Math.exp(-dt / 6));                  // (high-passed: no net pumping)
    const wRel = clamp(wRaw - S.wMean, -1.5, 1.5);
    S.wRelF += (wRel - S.wRelF) * (1 - Math.exp(-dt * 4));
    const ux = P.vel.x - sc.vx - sea.current.x, uz = P.vel.z - sc.vz - sea.current.z;   // drift through the water
    const sub = smoothstep(0.25, 0.6, P.sub);
    // torso: broad footprint at the waterline crossing (between the collar and chest probes)
    const ax = waterTexX(pN.x0 - water.drift.x), az = waterTexZ(pN.z0 - water.drift.z);
    const bx = waterTexX(pC.x0 - water.drift.x), bz = waterTexZ(pC.z0 - water.drift.z);
    waterAddSource((ax + bx) / 2, (az + bz) / 2, Math.max(0.26 / tx, 1.6), wRel * gain, ux * wake, uz * wake, 7 * sub,
      (0.15 + 1.0 * Math.abs(wRel) + 1.8 * Math.hypot(ux, uz)) * sub);
    // static waterline ring (trough deepens when the body rises out of the water, piles up when it sinks)
    if (nb < MAX_PEOPLE) {
      bodA[nb].set(ax, az, bx, bz);
      bodB[nb].set(0.17 / tx, 0.010 * sub * gain, clamp(0.012 + 0.05 * S.wRelF, -0.01, 0.04) * sub * gain, 0);
      nb++;
    }
    // hands sculling near the surface
    S.hands.forEach((H, k) => {
      if (!H.bone) return;
      H.bone.getWorldPosition(_wv);
      const fa = probe(base + WATER_FOREARM_PROBE[WATER_HANDS[k]]), fq = P.probes[WATER_FOREARM_PROBE[WATER_HANDS[k]]];
      const hs = fa.h + fa.sx * (_wv.x - fq.sx0) + fa.sz * (_wv.z - fq.sz0);
      const d = hs - _wv.y;                                                  // > 0: hand under water
      if (H.has && H.prev.distanceToSquared(_wv) < (6 * dt) ** 2) {         // (skip teleports / respawns)
        _wv2.copy(_wv).sub(H.prev).divideScalar(dt);                         // hand velocity (world)
        const rx = _wv2.x - fa.vx - sea.current.x, ry = _wv2.y - fa.vy, rz = _wv2.z - fa.vz - sea.current.z;
        const wgt = smoothstep(0.3, 0.0, d) * smoothstep(-0.06, 0.0, d);
        if (wgt > 0.01) {
          waterAddSource(toTX(_wv.x), toTZ(_wv.z), Math.max(0.085 / tx, 1.5), ry * gain, rx * gain, rz * gain, 9 * wgt,
            3.0 * Math.hypot(rx, ry, rz) * wgt);
        }
        // surface crossings and skimming -> splash events for the spray system
        const spd = Math.hypot(rx, ry, rz);
        if (H.prevD > 0 && d <= 0 && spd > 0.15) { water.events.push({ type: 'exit', pos: _wv.clone(), vel: new THREE.Vector3(rx, ry, rz), speed: spd }); H.drip = 1.2; }
        if (H.prevD < 0 && d >= 0 && spd > 0.25) water.events.push({ type: 'entry', pos: _wv.clone().setY(hs), vel: new THREE.Vector3(rx, ry, rz), speed: spd });
        if (Math.abs(d) < 0.05 && Math.hypot(rx, rz) > 0.3) water.events.push({ type: 'skim', pos: _wv.clone().setY(hs), vel: new THREE.Vector3(rx, ry, rz), speed: Math.hypot(rx, rz), dt });
        if (H.drip > 0 && d < -0.01) water.events.push({ type: 'drip', pos: _wv.clone(), vel: _wv2.clone(), level: H.drip, dt });
        H.drip = Math.max(0, H.drip - dt);
      }
      H.prev.copy(_wv); H.has = true; H.prevD = d;
    });
    // crest slapping the body: water rising fast past the body, steep or folding crest at the body
    S.slapCool -= dt;
    const J = probeBuf[(base + PROBES_PER - 1) * 4 + 3];
    const up = sc.vy - P.vel.y, hor = Math.hypot(sc.vx + sea.current.x - P.vel.x, sc.vz + sea.current.z - P.vel.z);
    const score = Math.max(up - 0.3, 0) * 2.2 + Math.max(hor - 0.45, 0) * 1.2 + Math.max(0.8 - J, 0) * 3;
    if (S.slapCool <= 0 && score > 0 && Math.random() < score * dt * 3) {
      S.slapCool = rand(1.2, 3.5);
      const n = probe(base + 1), q = P.probes[1];
      const pos = new THREE.Vector3(q.sx0, n.h + 0.02, q.sz0);
      const dir = new THREE.Vector3(sc.vx - P.vel.x, 0, sc.vz - P.vel.z);
      if (dir.lengthSq() < 1e-4) dir.set(sea.toward[0], 0, sea.toward[1]);
      dir.normalize();
      water.events.push({ type: 'slap', pos, dir, strength: clamp(0.4 + score, 0.4, 2.0) });
      waterAddSource((ax + bx) / 2, (az + bz) / 2, Math.max(0.35 / tx, 2), 0.25 * gain, 0, 0, 5, 2.5 * clamp(score, 0.3, 1.5));
    }
  });
  waterSimMat.uniforms.uBodN.value = nb;
  waterSimMat.uniforms.uSrcN.value = water.srcN;

  // ---- simulate (fixed substeps keep the dispersion stable at any time scale)
  const steps = Math.min(4, Math.max(1, Math.ceil(dt / 0.034)));
  const u = waterSimMat.uniforms;
  u.uDt.value = dt / steps;
  for (let k = 0; k < steps; k++) {
    u.uShift.value.copy(k === 0 ? water.shift : new THREE.Vector2(0, 0));
    u.uSeed.value.set(Math.random() * 512, Math.random() * 512);
    u.uState.value = water.stateA.texture;
    u.uImpact.value = water.impact.texture;
    runPass(waterSimMat, water.stateB);
    [water.stateA, water.stateB] = [water.stateB, water.stateA];
    if (k === 0) { renderer.setRenderTarget(water.impact); renderer.setClearColor(WATER_IMPACT_CLEAR, 0); renderer.clear(true, false, false); renderer.setClearColor(0x000000, 1); }
  }
  water.steps++;
  waterComposeMat.uniforms.uState.value = water.stateA.texture;
  waterComposeMat.uniforms.uGain.value = 1;
  runPass(waterComposeMat, water.out);
  renderer.setRenderTarget(null);
  oceanU.uWrTex.value = water.out.texture;
}

function waterSyncUniforms() {

}
HOOKS.update.push((dt) => { waterUpdate(dt); waterSyncUniforms(); });

// ---- GUI
const fWaterFx = gui.addFolder('Interactive water & spray');
fWaterFx.add(params, 'waterRipples').name('Ripples & wakes');
fWaterFx.add(params, 'waterRippleGain', 0, 3, 0.01).name('Ripple strength ×');
fWaterFx.add(params, 'waterWake', 0, 3, 0.01).name('Drift wake ×');
fWaterFx.add(params, 'waterMicroFoam', 0, 3, 0.01).name('Churn micro-foam ×');

// ===== src/features/water_spray.js =====
// ============================================================================
// Spray, splashes and spindrift: GPU particles  (feature: water_)
// ============================================================================
// Particle state lives in three float textures (position+age, velocity+lifetime, kind/size/seed/height above
// the water) updated by one full-screen pass. Slots are handed out as a ring buffer: each frame the CPU lists
// emitters (hand strokes, crest slaps from water_ripples.js, and a whitecap emitter) and the next slots of the
// ring are re-initialised from them, so nothing is read back. The whitecap emitter searches the world foam map
// on the GPU for folding crests (J below the breaking threshold) and spawns blown spray, spindrift streaks and
// mist puffs there. Droplets fall under gravity with wind drag (log wind profile), die on the wave surface and
// splat a small impulse into the ripple field; mist puffs ride the wind and fade.
// Rendering: camera-facing motion-blurred streaks (droplets) and soft noisy billboards (mist), lit by the sun
// (forward-peaked droplet phase function, faint primary rainbow at 138 deg) and the sky, aerial perspective,
// soft contact with the bodies; band radiance in the LWIR sensor pass.

const WATER_SPRAY_Q = [[64, 64], [128, 64], [128, 128], [256, 128]];
const WATER_MAXE = 32;

const WATER_SPRAY_SIM_FRAG = CASC_SAMPLERS(['uDisp']) + /* glsl */`
precision highp float;
precision highp int;
#define NC ${NC}
#define MAXE ${WATER_MAXE}
${NOISE_GLSL}
uniform sampler2D uS0, uS1, uS2, uFoam, uRip;
uniform float uCascL[NC];
uniform vec2 uFoamC;
uniform float uFoamSize, uJThr, uWcR;
uniform vec4 uRipXf;           // ripple field: lagrangian centre x, z, size, texel
uniform float uRipOn;
uniform float uDt, uTime, uFrame, uTexW, uNP, uHead, uSpawnN;
uniform vec3 uWind;            // 10 m wind vector x, z, speed
uniform vec4 uEmA[MAXE];       // position xyz, cumulative slot end
uniform vec4 uEmB[MAXE];       // velocity xyz, velocity spread
uniform vec4 uEmC[MAXE];       // type (0 droplets, 1 mist, 2 whitecap search), size, lifetime, radius
uniform int uEmN;
layout(location = 0) out vec4 o0;   // position, age
layout(location = 1) out vec4 o1;   // velocity, lifetime (0 = dead)
layout(location = 2) out vec4 o2;   // kind (0 droplet, 1 mist, 2 spindrift), size, seed, height above water | impact
uint gSeed;
float rnd() { gSeed = pcgHash(gSeed); return float(gSeed >> 8u) / 16777216.0; }

float surfaceAt(vec2 p, out vec2 x0) {

const WATER_IMPACT_VERT = /* glsl */`
uniform sampler2D uS1, uS2, uS0;
uniform float uTexW;

const WATER_IMPACT_FRAG = /* glsl */`

const WATER_SPRAY_VERT = /* glsl */`
uniform sampler2D uS0, uS1, uS2;
uniform samplerCube uEnv;
uniform float uTexW, uExpo;

uniform vec4 uFogExt;

out vec3 vShape;        // streak: along (px), across (px), length (px)
out vec2 vUv;           // mist: billboard coordinates
out float vHalfW, vKind, vSeed, vViewZ, vSoft;
float wrHG(float c, float g) { float g2 = g * g; return (1.0 - g2) / (12.566371 * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5)); }

const WATER_SPRAY_FRAG = /* glsl */`
uniform sampler2D uFoamTex, uRefrDepth;
uniform vec2 uResolution;
uniform float uNear, uFar, uThermal;
in vec4 vCol;
in vec3 vShape;
in vec2 vUv;
in float vHalfW, vKind, vSeed, vViewZ, vSoft;
layout(location = 0) out vec4 fragColor;
void main() {
  if (vCol.a <= 0.0) discard;
  float a;
  if (vKind > 0.5 && vKind < 1.5) {
    float r = length(vUv);
    if (r > 1.0) discard;
    float ang = vSeed * 6.2831853;

    float rr = clamp(dd / max(vHalfW, 1e-3), 0.0, 1.0);

function waterAllocSpray() {

async function recWrite(path, data) {
  const size = data.size ?? data.byteLength ?? data.length;
  if (REC.session) {
    const i = path.lastIndexOf('/');
    let d = REC.session;
    if (i > 0) {
      const sub = path.slice(0, i);

      if (!d) { d = await REC.session.getDirectoryHandle(sub, { create: true }); REC.subdirs.set(sub, d); }
    }
    const f = await d.getFileHandle(path.slice(i + 1), { create: true });

    await w.close();

    const bytes = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : typeof data === 'string' ? new TextEncoder().encode(data) : data;
    const name = REC.sessName + '/' + path, k = REC.zip.findIndex(e => e.name === name);   // rewritten files (session.json) replace
    if (k >= 0) REC.zip[k].data = bytes; else REC.zip.push({ name, data: bytes });

function recTask(p) {

// minimal .zip (stored, no compression) for browsers without folder access
const REC_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function recCrc(u8) { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = REC_CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function recZip(entries) {
  const enc = new TextEncoder(), parts = [], central = [], d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0, cdSize = 0;
  for (const e of entries) {
    const nm = enc.encode(e.name), crc = recCrc(e.data), sz = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nm, e.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(ch.buffer, nm);
    off += 30 + nm.length + sz; cdSize += 46 + nm.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

    if (ir.img) recTask(recEncodeImage(ir.img, w, h, 'image/png').then(b => recWrite(`ir/${name}.png`, b)));

// ============================================================================
// Mapping mission: an area route planner in the style of DJI Pilot 2 / DJI FlightHub, and an automatic flight
// that carries the EO, LWIR and LiDAR payload along the route
// ============================================================================
// Planning (top-down map of the live scene):
//   - click on the sea to add boundary points (3 or more); drag a point to move it, drag a "+" midpoint to add one,
//     Delete removes the selected point. The polygon is the survey area; the margin grows or shrinks it;
//   - the route is generated automatically: parallel flight lines inside the area, flown back and forth (a zigzag /
//     lawnmower pattern). Line direction = course angle (clockwise from north); line spacing comes from the camera
//     footprint at the flight altitude and the side overlap, the photo interval from the front overlap, as DJI does:
//       footprint across track W = 2 h tan(HFOV / 2), spacing = W (1 - side overlap),
//       footprint along track  F = 2 h tan(VFOV / 2), photo interval = F (1 - front overlap);
//   - speed 5-100 m/s (stepless), altitude, gimbal pitch, completion action (return to home / hover / repeat), start
//     corner, and optional recording of the three sensors during the flight.
// Flight: the aircraft flies the route at constant altitude and speed (heading follows the route with a limited yaw
// rate); the main view and the three sensor windows are the gimbal view. The mouse only tilts the gimbal (drag up /
// down); Space pauses; Esc ends the flight. The aircraft takes off from, and returns to, the start point S.
Object.assign(params, {
  rtAlt: 100, rtSpeed: 15, rtAngle: 0, rtSide: 70, rtFront: 80, rtMargin: 0, rtPitch: -90, rtFinish: 'rth', rtRecord: false, rtStart: 0,

const RT = {

try {

const RT_MAP_FOV = 40;
function rtFlightFov() { return RT.saved ? RT.saved.fov : camera.fov; }                 // the gimbal camera's vertical FOV
function rtArea(V) { let a = 0; for (let i = 0; i < V.length; i++) { const p = V[i], q = V[(i + 1) % V.length]; a += p.x * q.z - q.x * p.z; } return a / 2; }
// offset a polygon by m metres (outwards for m > 0), mitred corners with a limited miter
function rtOffset(V, m) {
  if (!m || V.length < 3) return V.map(v => ({ ...v }));
  const s = Math.sign(rtArea(V)) || 1, n = V.length, N = [];
  for (let i = 0; i < n; i++) {
    const a = V[i], b = V[(i + 1) % n], ex = b.x - a.x, ez = b.z - a.z, l = Math.hypot(ex, ez) || 1;
    N.push({ x: s * ez / l, z: -s * ex / l });
  }
  return V.map((v, i) => {
    const n1 = N[(i + n - 1) % n], n2 = N[i], d = 1 + n1.x * n2.x + n1.z * n2.z, k = m / Math.max(d, 0.25);
    return { x: v.x + (n1.x + n2.x) * k, z: v.z + (n1.z + n2.z) * k };

}
// footprint and spacing of the gimbal camera pointing straight down (5:4 sensor)
function rtFootprint() {
  const vf = rtFlightFov() * D2R, hf = 2 * Math.atan(Math.tan(vf / 2) * SENSOR_W / SENSOR_H), h = params.rtAlt;
  const across = 2 * h * Math.tan(hf / 2), along = 2 * h * Math.tan(vf / 2);
  return { across, along, spacing: Math.max(1, across * (1 - params.rtSide / 100)), interval: Math.max(0.5, along * (1 - params.rtFront / 100)) };
}
// the zigzag: lines parallel to the course angle across the (margin-adjusted) polygon, flown alternately
function rtBuild() {
  const V = RT.verts;
  if (V.length < 3) { RT.route = null; return; }
  const poly = rtOffset(V, params.rtMargin), psi = params.rtAngle * D2R, fp = rtFootprint();
  const dir = { x: Math.sin(psi), z: -Math.cos(psi) }, perp = { x: Math.cos(psi), z: Math.sin(psi) };   // along line, across lines
  const UV = poly.map(p => ({ u: p.x * dir.x + p.z * dir.z, v: p.x * perp.x + p.z * perp.z }));
  let vmin = Infinity, vmax = -Infinity;
  for (const p of UV) { vmin = Math.min(vmin, p.v); vmax = Math.max(vmax, p.v); }
  const range = vmax - vmin, nL = Math.max(1, Math.floor(range / fp.spacing) + 1), v0 = vmin + (range - (nL - 1) * fp.spacing) / 2;
  const lines = [];
  for (let k = 0; k < nL; k++) {
    const v = v0 + k * fp.spacing, us = [];
    for (let i = 0; i < UV.length; i++) {
      const a = UV[i], b = UV[(i + 1) % UV.length];
      if ((a.v <= v && b.v > v) || (b.v <= v && a.v > v)) us.push(a.u + (v - a.v) / (b.v - a.v) * (b.u - a.u));

    if (us.length >= 2) lines.push({ v, u0: Math.min(...us), u1: Math.max(...us) });

  if (!lines.length) { RT.route = null; return; }
  if (params.rtStart & 1) lines.reverse();
  const P = (u, v) => ({ x: u * dir.x + v * perp.x, z: u * dir.z + v * perp.z });
  const pts = [];
  lines.forEach((L, k) => {
    const fwd = ((k & 1) === 0) !== !!(params.rtStart & 2);
    pts.push(P(fwd ? L.u0 : L.u1, L.v), P(fwd ? L.u1 : L.u0, L.v));

  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z);
  for (const L of lines) { const l = L.u1 - L.u0; lineLen += l; photos += Math.floor(l / fp.interval) + 1; }

  const rth = params.rtFinish === 'rth' ? Math.hypot(last.x - home.x, last.z - home.z) : 0;
  RT.route = { pts, len, lineLen, lines: lines.length, spacing: fp.spacing, interval: fp.interval, photos, rth,
    area: Math.abs(rtArea(V)), duration: (len + rth) / params.rtSpeed };
}

  }
  m.lineWidth = 2; m.strokeStyle = 'rgba(255,255,255,.35)';
  m.beginPath(); F.pts.forEach((p, i) => { const [a, b] = M(p); i ? m.lineTo(a, b) : m.moveTo(a, b); }); m.stroke();
  m.strokeStyle = '#34d27b'; m.beginPath();
  for (let i = 0; i <= F.seg; i++) { const [a, b] = M(F.pts[i]); i ? m.lineTo(a, b) : m.moveTo(a, b); }
  { const [a, b] = M(F.pos); m.lineTo(a, b); } m.stroke();
  m.fillStyle = '#ff6b3d';
  for (const P of people) { const [a, b] = M({ x: P.pos.x, z: P.pos.z }); m.beginPath(); m.arc(a, b, 2.5, 0, Math.PI * 2); m.fill(); }
  { const [a, b] = M(F.pts[0]); m.fillStyle = '#21c45d'; m.beginPath(); m.arc(a, b, 5, 0, Math.PI * 2); m.fill(); }
  const [ax, ay] = M(F.pos), h = -F.yaw;                     // screen angle of the nose (north up)
  m.save(); m.translate(ax, ay); m.rotate(h);
  m.fillStyle = '#fff'; m.strokeStyle = '#000'; m.lineWidth = 1;
  m.beginPath(); m.moveTo(0, -9); m.lineTo(6, 7); m.lineTo(0, 3); m.lineTo(-6, 7); m.closePath(); m.fill(); m.stroke();
  m.restore();
  m.fillStyle = '#fff'; m.font = '10px Consolas, monospace'; m.textAlign = 'left'; m.fillText(zh ? '北 ↑' : 'N ↑', 8, 14);
}

HOOKS.afterRender.push(() => {
  if (RT.mode === 'plan') rtDrawPlan();
  else if (RT.mode === 'fly') rtDrawFly();
});

// ---------------------------------------------------------------------------- entry button and language
const rtEntry = document.createElement('div');
rtEntry.className = 'seg';
rtEntry.innerHTML = '<button type="button"></button>';
uiSwitches.insertBefore(rtEntry, uiSwitches.firstChild);
rtEntry.querySelector('button').addEventListener('click', rtPlanEnter);
function rtEntryText() { rtEntry.querySelector('button').textContent = '✈ ' + i18n('Flight route'); }
rtBindPanel();
rtBuild();
rtEntryText();
LANG_HOOKS.push(() => { rtEntryText(); rtTexts(); if (RT.mode === 'plan') rtPanel(); });
HOOKS.ready.push(() => {
  window.sim.route = { RT, enter: rtPlanEnter, exitPlan: rtPlanExit, fly: rtFlyStart, exitFly: rtFlyExit, build: rtBuild, toScreen: rtToScreen, toSea: rtToSea };
});
// ===== src/core/99_main.js =====
// ============================================================================
// Main loop
// ============================================================================
const statsEl = document.getElementById('stats');
const BFT = [0.5, 1.6, 3.4, 5.5, 8, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7];
const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
let simTime = 0, physAcc = 0, hudT = 0;
function updateHud() {
  const U = params.windSpeed, bft = BFT.findIndex(v => U < v);
  const meanSub = people.length ? people.reduce((s, P) => s + P.sub, 0) / people.length : 0;
  const c = groupCentroid(new THREE.Vector3());
  const b = bft < 0 ? 12 : bft, k = s => `<span class="k">${i18n(s)}</span>`;
  statsEl.innerHTML =
    `${k('Sea state')} ${typeof seaStateText === 'function' ? seaStateText() + ' · ' : ''}Hs ${sea.Hs.toFixed(2)} m · Tp ${sea.Tp.toFixed(1)} s · λp ${sea.lp.toFixed(0)} m · ${LANG === 'zh' ? `蒲福 ${b} 级` : `Bft ${b}`}<br>` +
    `${k('Wind')} ${U.toFixed(1)} m/s ${i18n('from')} ${params.windFrom.toFixed(0)}° (${i18n(COMPASS[Math.round(params.windFrom / 45) % 8], 'compass')}) · ${k('drift')} ${Math.hypot(sea.current.x, sea.current.z).toFixed(2)} m/s<br>` +
    `${k('Sun')} ${sunElDeg.toFixed(1)}° · ${k('sim t')} ${simTime.toFixed(0)} s<br>` +
    `${k('In water')} ${people.length}${modelsReady ? '' : i18n(' (loading models…)')} · ${i18n('mean submerged')} ${(meanSub * 100).toFixed(0)}% · ${i18n('group')} (${c.x.toFixed(0)}, ${c.z.toFixed(0)}) m`;
}

const clock = new THREE.Clock();
const centroid = new THREE.Vector3(), prevTarget = new THREE.Vector3();
function update(dtReal) {
  if (skyDirty) updateSky();
  const dt = params.paused ? 0 : dtReal * params.timeScale;
  simTime += dt;
  oceanU.uFoamP.value.set(0.36 + 0.12 * params.foam, 2.5, 1, 1);

  simulateWaves(simTime);
  writeQueries();
  runProbes(simTime);

  // physics substeps on the sampled surface
  physAcc += dt;
  let steps = 0, tSub = simTime - physAcc;
  while (physAcc >= PHYS_DT && steps < 12) {
    people.forEach((P, i) => stepPerson(P, i, PHYS_DT, tSub));
    physAcc -= PHYS_DT; tSub += PHYS_DT; steps++;
  }
  if (steps === 12) physAcc = 0;

  // people visuals: pose (sculling arms), waterline plane for the wet shader, foam injection, strobes
  const fp = foamUpdMat.uniforms.uPeople.value;
  people.forEach((P, i) => {
    P.root.position.copy(P.pos); P.root.quaternion.copy(P.q);
    setAims(P, simTime); solvePose(P.rig);
    const sc = probe(i * PROBES_PER + PROBES_PER - 1);
    _n.set(-sc.sx, 1, -sc.sz).normalize();
    P.wetU.plane.value.set(_n.x, _n.y, _n.z, -(_n.x * P.pos.x + _n.y * sc.h + _n.z * P.pos.z));
    P.headBones[0].getWorldPosition(P.wetU.head.value).add(P.headBones[1].getWorldPosition(_v2)).multiplyScalar(0.5);
    // the waterline crosses the inclined body around the collar and chest (probes 1 and 2)
    const rel = Math.hypot(P.vel.x - sea.current.x, P.vel.z - sea.current.z);
    const pa = probe(i * PROBES_PER + 1), pb = probe(i * PROBES_PER + 2);
    fp[i].set((pa.x0 + pb.x0) / 2, (pa.z0 + pb.z0) / 2, 0.24, clamp(0.15 + rel * 0.8, 0, 0.45) * smoothstep(0.3, 0.6, P.sub));
    const flash = ((simTime * 0.9 + P.strobePh) % 1) < 0.08 ? 1 : 0;
    P.bulbMat.emissiveIntensity = flash * (3 + 400 * nightF);
    P.glow.material.opacity = flash * (0.1 + 0.9 * nightF);
    if (params.showProbes) P.probeMats.forEach((m, k) => m.color.setRGB(1 - P.frac[k], 0.25 + 0.6 * P.frac[k], P.frac[k]));
  });
  foamUpdMat.uniforms.uPeopleCount.value = people.length;
  if (dt > 0) updateFoam(dt);
  oceanU.uFoamWorld.value = foamSrc.texture;
  for (const h of HOOKS.update) h(dt, dtReal);

  // camera: a feature may drive it (route planner map, mission flight); otherwise follow the group, stay above the water
  if (cameraDriver) cameraDriver(dt, dtReal);
  else {
    if (params.followGroup && people.length) {
      prevTarget.copy(controls.target);
      groupCentroid(centroid);
      controls.target.lerp(centroid, 1 - Math.exp(-dtReal * 0.8));
      camera.position.add(prevTarget.sub(controls.target).negate());
    }
    controls.update();
    const hc = probeBuf[CAM_PROBE * 4];
    if (!params.uwAllowUnder && camera.position.y < hc + 0.6) camera.position.y = hc + 0.6;
  }

  oceanU.uCenter.value.set(camera.position.x, camera.position.z);
  oceanU.uTime.value = simTime;
  oceanU.uWind.value.set(sea.toward[0], sea.toward[1], params.windSpeed);
  skyU.uCloud.value.w = simTime;
  skyU.uCamXZ.value.set(camera.position.x, camera.position.z);
  skyU.uPixAng.value = 2 * Math.tan(camera.fov * D2R / 2) / drawSize.y;
  skyDome.position.copy(camera.position);
  envTimer -= dtReal;
  if (envTimer <= 0) refreshEnv();

  updateThermalEnv();
  updateSensorPose(dt);
  lastDtReal = dtReal;
  for (const h of HOOKS.lateUpdate) h(dt, dtReal);

  hudT -= dtReal;
  if (hudT <= 0) { updateHud(); updateSensorOSD(); hudT = 0.25; }
}
let lastDtReal = 1 / 60;
function render() {
  for (const h of HOOKS.beforeRender) h();
  // submerged bodies -> refraction target (people layer only, transparent background)
  camera.layers.set(PEOPLE_LAYER);
  renderer.setRenderTarget(refrRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setClearColor(0x000000, 1);
  camera.layers.set(0);
  renderer.setRenderTarget(null);
  composer.render();
  renderSensors(lastDtReal);
  for (const h of HOOKS.afterRender) h();
}
let stepLimit = Infinity;        // the data recorder caps the step so that no capture is skipped (0 = hold)
function frame() {
  update(Math.min(clock.getDelta(), 0.05, stepLimit));
  render();
  requestAnimationFrame(frame);
}
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(drawSize);
  composer.setPixelRatio(1); composer.setSize(drawSize.x, drawSize.y);
  refrRT.setSize(drawSize.x, drawSize.y);
  oceanU.uResolution.value.copy(drawSize);
  compositePass.uniforms.uAspect.value = drawSize.x / drawSize.y;
  for (const h of HOOKS.resize) h(drawSize.x, drawSize.y);
}
window.addEventListener('resize', onResize);
onResize();

updateSky();
placeCamera();
const loader = new GLTFLoader();
Promise.allSettled(MODEL_DEFS.map(d => loader.loadAsync(MODEL_BASE + d.file))).then(res => {
  res.forEach((r, i) => {
    if (r.status === 'fulfilled') templates.push(prepareTemplate(r.value, MODEL_DEFS[i]));
    else console.warn('model failed to load', MODEL_DEFS[i].file, r.reason);
  });
  if (!templates.length) throw new Error(i18n('Could not load the human models from the CDN (check the network connection).'));
  modelsReady = true;
  setPeopleCount(params.people);
  placeCamera();
});

// console hook for scripted testing: advance n frames of dt seconds, then draw once
const tick = (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) update(dt); render(); };
window.sim = { params, people, sea, oceanU, skyU, camera, controls, gui, tick, probe, setPeopleCount, templates, renderer, ocean, finalRT, h0RT, probeBuf, sensorCam, agc, THERM, irRT, HOOKS, get modelsReady() { return modelsReady; }, get stepLimit() { return stepLimit; } };
for (const h of HOOKS.ready) h();
requestAnimationFrame(frame);
</script>
