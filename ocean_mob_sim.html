<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;

  .lil-gui { --font-family: -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; top: 12px; max-width: 340px; pointer-events: none;
    color: #e6f0f4; background: rgba(5, 14, 22, 0.5); backdrop-filter: blur(6px);
    padding: 10px 13px; border-radius: 8px; font-size: 12px; line-height: 1.55;
  }
  #hud h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  #hud .k { color: #93aebb; }
  #hud .hint { margin-top: 6px; color: #93aebb; font-size: 11px; }
  .sensor { position: fixed; bottom: 12px; pointer-events: none; border: 1px solid rgba(190, 215, 225, 0.55);
            border-radius: 3px; box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45); font: 11px/1.3 Consolas, "Cascadia Mono", "Microsoft YaHei", "PingFang SC", monospace; color: #e8f4f8; }
  .sensor .t { position: absolute; left: 0; top: 0; right: 0; padding: 4px 7px; display: flex; justify-content: space-between;
               background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0)); text-shadow: 0 0 3px #000; }
  .sensor .b { position: absolute; left: 0; bottom: 0; right: 0; padding: 4px 7px; display: flex; justify-content: space-between;
               background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.5)); text-shadow: 0 0 3px #000; }
  .sensor .rec { color: #ff6b5a; }
  #err { position: fixed; left: 12px; bottom: 12px; right: 12px; color: #ffd2d2; background: rgba(80, 0, 0, .8);
         padding: 8px 10px; border-radius: 6px; font: 12px monospace; white-space: pre-wrap; display: none; }

// insert GLSL on the lines after a "// @hook:name" marker line of a ShaderMaterial (vertex or fragment)
function injectShader(material, hook, code, stage = 'fragment') {
  const key = stage === 'vertex' ? 'vertexShader' : 'fragmentShader';
  const src = material[key], at = src.indexOf('// @hook:' + hook);
  if (at < 0) throw new Error('shader hook not found: ' + hook);
  const eol = src.indexOf('\n', at);
  const end = eol < 0 ? src.length : eol;
  material[key] = src.slice(0, end) + '\n' + code + '\n' + src.slice(end);
  material.needsUpdate = true;
}

{

const compositePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uExposure: { value: params.exposure }, uFrame: { value: 0 }, uAspect: { value: 1 } },

  fragmentShader: /* glsl */`
uniform sampler2D tDiffuse;
uniform float uExposure, uFrame, uAspect;
varying vec2 vUv;
vec3 agxContrast(vec3 x) {
  vec3 x2 = x * x, x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
vec3 agx(vec3 v) {
  mat3 m = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                0.0784335999999992, 0.878468636469772, 0.0784336,
                0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  const float minEv = -12.47393, maxEv = 4.026069;
  vec3 x = clamp(log2(m * max(v, vec3(1e-10))), vec3(minEv), vec3(maxEv));
  return agxContrast((x - minEv) / (maxEv - minEv));
}
vec3 agxEotf(vec3 v) {
  mat3 mi = mat3(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                 -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                 -0.0990297440797205, -0.0989611768448433, 1.15107367264116);
  return mi * v;
}
vec3 agxLook(vec3 v, float sat, float power) {
  float l = dot(v, vec3(0.2126, 0.7152, 0.0722));
  return l + sat * (pow(max(v, vec3(0.0)), vec3(power)) - l);
}
float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
void main() {
  vec3 c = texture2D(tDiffuse, vUv).rgb * uExposure;
  vec2 d = (vUv - 0.5) * vec2(uAspect, 1.0);
  c *= 1.0 - 0.10 * dot(d, d);
  c *= vec3(0.81, 1.0, 1.19);

  c = mix(c, vec3(lum), smoothstep(0.7, 6.0, lum) * 0.55);

  gl_FragColor = vec4(clamp(o, 0.0, 1.0), 1.0);
}`,
});

const ATMO_GLSL = /* glsl */`
const float PI = 3.14159265358979;
const float RG = 6360.0;
const float RT = 6460.0;
const vec3 RAY_S = vec3(5.802e-3, 13.558e-3, 33.1e-3);
const float MIE_S = 3.996e-3;
const float MIE_E = 4.40e-3;
const vec3 OZO_A = vec3(0.650e-3, 1.881e-3, 0.085e-3);
const float SUN_ANG_R = 0.004675;
const float TRANS_W = 256.0;
const float TRANS_H = 64.0;
const float MS_SIZE = 32.0;
const float SKY_W = 256.0;
const float SKY_H = 144.0;
struct Medium { vec3 ext; vec3 rayS; float mieS; };
Medium medium(float h, float haze) {
  float hh = max(h, 0.0);
  float dR = exp(-hh / 8.0);
  float dM = exp(-hh / 1.2);
  float dO = max(0.0, 1.0 - abs(hh - 25.0) / 15.0);
  Medium m;
  m.rayS = RAY_S * dR;
  m.mieS = MIE_S * dM * haze;
  m.ext = m.rayS + vec3(MIE_E * dM * haze) + OZO_A * dO;
  return m;
}
vec2 raySphere(vec3 ro, vec3 rd, float R) {
  float l = length(ro);
  float b = dot(ro, rd);
  float c = (l - R) * (l + R);
  float d = b * b - c;
  if (d < 0.0) return vec2(-1.0);
  float s = sqrt(d);
  return vec2(-b - s, -b + s);
}
float rhoOf(float r) { return sqrt(max(0.0, (r - RG) * (r + RG))); }
vec2 transRMuToUV(float r, float mu) {
  float H = sqrt(RT * RT - RG * RG);
  float rho = rhoOf(r);
  float disc = r * r * (mu * mu - 1.0) + RT * RT;
  float d = max(0.0, -r * mu + sqrt(max(disc, 0.0)));
  float dMin = RT - r;
  float dMax = rho + H;
  return vec2((d - dMin) / (dMax - dMin), rho / H);
}
vec2 transUVToRMu(vec2 uv) {
  float H = sqrt(RT * RT - RG * RG);
  float rho = H * uv.y;
  float r = sqrt(rho * rho + RG * RG);
  float dMin = RT - r;
  float dMax = rho + H;
  float d = dMin + uv.x * (dMax - dMin);
  float mu = 1.0;
  if (d > 0.0) mu = (H * H - rho * rho - d * d) / (2.0 * r * d);
  return vec2(r, clamp(mu, -1.0, 1.0));
}
float fromUnitToSubUvs(float u, float res) { return (u + 0.5 / res) * (res / (res + 1.0)); }
float fromSubUvsToUnit(float u, float res) { return (u - 0.5 / res) * (res / (res - 1.0)); }
float phaseRayleigh(float c) { return 3.0 / (16.0 * PI) * (1.0 + c * c); }
float phaseMie(float c, float g) {
  float g2 = g * g;
  return 3.0 / (8.0 * PI) * ((1.0 - g2) * (1.0 + c * c)) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
float phaseHG(float c, float g) {
  float g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
bool sunBelowHorizon(float r, float mu) { return mu < -rhoOf(r) / r; }
`;

const NOISE_GLSL = /* glsl */`
uint pcgHash(uint v) {
  uint s = v * 747796405u + 2891336453u;
  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
vec2 hashGrad(ivec2 i) {
  uint h = pcgHash(uint(i.x) * 1664525u + pcgHash(uint(i.y) + 1013904223u));
  float a = float(h) * (6.28318530718 / 4294967296.0);
  return vec2(cos(a), sin(a));
}
float gnoise(vec2 p) {
  ivec2 i = ivec2(floor(p));
  vec2 f = p - floor(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(hashGrad(i), f);
  float b = dot(hashGrad(i + ivec2(1, 0)), f - vec2(1.0, 0.0));
  float c = dot(hashGrad(i + ivec2(0, 1)), f - vec2(0.0, 1.0));
  float d = dot(hashGrad(i + ivec2(1, 1)), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
int imod(int a, int b) { return a - b * int(floor(float(a) / float(b))); }
float pnoise(vec2 p, int period) {
  ivec2 i = ivec2(floor(p));
  vec2 f = p - floor(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  ivec2 i00 = ivec2(imod(i.x, period), imod(i.y, period));
  ivec2 i10 = ivec2(imod(i.x + 1, period), i00.y);
  ivec2 i01 = ivec2(i00.x, imod(i.y + 1, period));
  ivec2 i11 = ivec2(i10.x, i01.y);
  float a = dot(hashGrad(i00), f);
  float b = dot(hashGrad(i10), f - vec2(1.0, 0.0));
  float c = dot(hashGrad(i01), f - vec2(0.0, 1.0));
  float d = dot(hashGrad(i11), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float pfbm(vec2 p, int period, int oct) {
  float s = 0.0, a = 0.5;
  vec2 q = p;
  int per = period;
  for (int o = 0; o < 8; o++) {
    if (o >= oct) break;
    s += a * pnoise(q, per);
    q *= 2.0; per *= 2; a *= 0.5;
  }
  return s;
}
`;

const THERMAL_GLSL = /* glsl */`
// ===================== LWIR physics (8-14 um) =====================
const float LWIR_C1 = 1.191042972e8;   // 2hc^2   [W m^-2 sr^-1 um^4]  (CODATA)
const float LWIR_C2 = 14387.7688;      // hc/k_B  [um K]
float lwirPlanckLam(float lam, float T) {                 // spectral radiance [W m^-2 sr^-1 um^-1]
  return LWIR_C1 / (lam * lam * lam * lam * lam * (exp(LWIR_C2 / (lam * T)) - 1.0));
}
// 1) Band radiance: 4-point Gauss-Legendre over 8-14 um (nodes 11 +- 3*x_i, weights 3*w_i).
// The integrand is smooth and single-humped, so GL4 is exact to < 3e-6 relative over 180-360 K
// (< 3e-5 for the 5772 K Sun) against a 20000-step trapezoid reference. 4 exp() per call.
float planckBand(float T) {
  T = max(T, 100.0);
  return 1.0435645354 * (lwirPlanckLam(8.4165910652, T) + lwirPlanckLam(13.5834089348, T))
       + 1.9564354646 * (lwirPlanckLam(9.9800568693, T) + lwirPlanckLam(12.0199431307, T));
}
// Inverse: Sakuma-Hattori form L = C / (exp(c2 / (A T + B)) - 1), fitted (minimax over 200-350 K)
// to planckBand(). Closed form, no iteration: |error| < 0.01 K over 200-350 K (< 0.05 K 180-400 K).
const float LWIR_SH_A = 9.3734;   // um
const float LWIR_SH_B = 173.725;  // um K
const float LWIR_SH_C = 6747.59;  // W m^-2 sr^-1
float bandTemp(float L) {
  return (LWIR_C2 / log(LWIR_SH_C / max(L, 1e-4) + 1.0) - LWIR_SH_B) / LWIR_SH_A;
}
// Surface-leaving radiance (opaque, Kirchhoff: reflectance = 1 - emissivity).
float surfaceRadianceLWIR(float T, float eps, float Lrefl) {
  return eps * planckBand(T) + (1.0 - eps) * Lrefl;
}

// 2) Sea-surface emissivity: exact Fresnel for an absorbing medium, unpolarised = (Rs+Rp)/2
// (Born & Wolf; a,b = Re/Im of the refracted wave term). Effective index n=1.242, k=0.154 was
// fitted so this single evaluation reproduces, within 0.001 for 0-85 deg, the Planck(290 K)-
// weighted band average of spectral Fresnel emissivity from Hale & Querry (1973) pure-water
// optical constants (e.g. 10 um n=1.218 k=0.051; 11 um 1.153/0.097; 12 um 1.111/0.199;
// 13 um 1.123/0.305). Seawater differs by < 0.5% (Friedman 1969). Result: 0.984 nadir,
// 0.945 at 60 deg, 0.65 at 80 deg -- consistent with Masuda et al. (1988, RSE 24:313).
// Wave-slope roughening is NOT built in: evaluate per facet with the shaded normal (the ocean
// shader's normal maps do that), which reproduces Masuda's wind dependence to first order.
const float LWIR_WATER_N = 1.242;
const float LWIR_WATER_K = 0.154;
float waterEmissivity(float cosTheta) {
  float c = clamp(cosTheta, 1e-3, 1.0);
  float s2 = 1.0 - c * c;
  float n = LWIR_WATER_N, k = LWIR_WATER_K;
  float A = n * n - k * k - s2;
  float r = sqrt(A * A + 4.0 * n * n * k * k);
  float a = sqrt(0.5 * (r + A));
  float b2 = 0.5 * (r - A);
  float Rs = ((a - c) * (a - c) + b2) / ((a + c) * (a + c) + b2);
  float st = s2 / c;                                        // sin(theta) * tan(theta)
  float Rp = Rs * ((a - st) * (a - st) + b2) / ((a + st) * (a + st) + b2);
  return 1.0 - 0.5 * (Rs + Rp);
}
// Foam/whitecap: bubble layer is a near-black volume emitter, ~0.99 and almost angle-independent
// (Niclos et al. 2007; Salisbury et al. 1993 report 0.99+ at nadir); mild drop at grazing angles.
float foamEmissivity(float cosTheta) {
  float g = 1.0 - clamp(cosTheta, 0.0, 1.0);
  return 0.99 - 0.06 * g * g * g * g;
}

// 3) Downwelling sky radiance. Vapour pressure: Magnus/Bolton (1980) e_s [hPa].
float lwirVapourPressure(float Tair, float rh) {                        // [hPa]
  float tc = Tair - 273.15;
  return clamp(rh, 0.0, 1.0) * 6.112 * exp(17.67 * tc / (tc + 243.5));
}
float lwirVapourDensity(float Tair, float rh) {                         // [g m^-3]
  return 216.7 * lwirVapourPressure(Tair, rh) / Tair;
}
// Clear-sky 8-14 um zenith emissivity relative to planckBand(Tair). Hemispheric value from
// Idso (1981, Water Resour. Res. 17:295) 8-14 um equation eps_h = 0.24 + 2.98e-8 e^2 exp(3000/T)
// (e hPa; 0.24 = CO2/O3 dry floor, e^2 = water-vapour self-continuum), capped at 0.92 because
// the fit was made in dry/temperate air and overshoots in tropical humidity. Converted to zenith
// with the Elsasser diffusivity factor 1.66: 1-eps_h = (1-eps_z)^1.66.
float lwirZenithEmissivity(float Tair, float rh) {
  float e = lwirVapourPressure(Tair, rh);
  float eh = min(0.24 + 2.98e-8 * e * e * exp(3000.0 / Tair), 0.92);
  return 1.0 - pow(1.0 - eh, 1.0 / 1.66);
}
// Slant path: plane-parallel optical depth ~ 1/sin(el); eps -> 1 (air temperature) at horizon.
float lwirSkyEmissivity(float elevSin, float Tair, float rh) {
  return 1.0 - pow(1.0 - lwirZenithEmissivity(Tair, rh), 1.0 / max(elevSin, 0.01));
}
float lwirAtmTransmittance(float elevSin, float Tair, float rh) {       // slant, to space
  return 1.0 - lwirSkyEmissivity(elevSin, Tair, rh);
}
// cloudFrac: cloud opacity along the ray (e.g. alpha of cloudLayers()). Water clouds are black
// in LWIR (eps ~1 for LWP > ~30 g m^-2); thin cirrus should pass a reduced cloudFrac. The cloud
// is seen through the sub-cloud clear path (transmittance 1-eps); above-cloud emission ignored.
// Tair..Tair-15 K for low stratus, ~230 K for cirrus; see cloudBaseTempLWIR().
float skyRadianceLWIR(float elevSin, float Tair, float rh, float cloudFrac, float Tcloud) {
  float eps = lwirSkyEmissivity(elevSin, Tair, rh);
  return eps * planckBand(Tair) + clamp(cloudFrac, 0.0, 1.0) * (1.0 - eps) * planckBand(Tcloud);
}
float cloudBaseTempLWIR(float Tair, float baseHeightM) {   // ~6.5 K/km mean tropospheric lapse
  return Tair - 0.0065 * baseHeightM;
}

// 4) Horizontal path. Window extinction is dominated by the water-vapour continuum: self term
// ~ rho_v^2 with exp(1800(1/T - 1/296)) temperature dependence (Roberts, Selby & Biberman 1976,
// Appl. Opt. 15:2085; their C_s ~ 6-14 g^-1 cm^2 atm^-1 across 8-12.5 um gives 0.14-0.32 km^-1 at
// 13 g m^-3 -- our band mean 0.17), plus a linear term (foreign continuum + weak H2O lines near
// 8 um) and a 0.05 km^-1 floor (CO2 15 um band edge at 13-14 um, maritime aerosol). Result:
// 0.08 km^-1 (cold dry) .. 0.3 km^-1 (20 C, 75% RH) .. 0.75 km^-1 (tropical). Beer's law on a band
// mean slightly overstates loss at long range (saturated lines); add fog/rain extinction as needed.
float lwirExtinctionPerKm(float rh, float Tair) {
  float rv = lwirVapourDensity(Tair, rh);
  return 0.05 + 0.0075 * rv + 0.00095 * rv * rv * exp(1800.0 * (1.0 / Tair - 1.0 / 296.0));
}
float pathTransmittanceLWIR(float distM, float rh, float Tair) {
  return exp(-lwirExtinctionPerKm(rh, Tair) * max(distM, 0.0) * 1e-3);
}
// x = tau, y = path radiance  =>  L_seen = L_target * r.x + r.y. Path assumed at Tair (isothermal).
// Do NOT apply to sky pixels: skyRadianceLWIR() already contains the whole atmospheric column.
vec2 pathTauRadLWIR(float distM, float rh, float Tair) {
  float tau = pathTransmittanceLWIR(distM, rh, Tair);
  return vec2(tau, (1.0 - tau) * planckBand(Tair));
}
float applyPathLWIR(float Ltarget, float distM, float rh, float Tair) {
  vec2 p = pathTauRadLWIR(distM, rh, Tair);
  return Ltarget * p.x + p.y;
}

// 6) Sun glint and opacity. Solar 8-14 um irradiance at TOA = Omega_sun (6.794e-5 sr) x
// planckBand(5772 K) = 1.51 W m^-2 (~0.1% of the solar constant; the Sun's real 10 um brightness
// temperature is ~5000 K, so this is an upper bound). After the slant path it is ~1 W m^-2, versus
// ~20-50 W m^-2 sr^-1 of thermal scene radiance and water reflectance 0.015 near nadir: LWIR glint
// is weak, mostly visible as faint sparkle at grazing sun/view geometry where R -> 0.3+.
// specTerm = the shader's microfacet lobe D*G/(4 cos_o) [sr^-1] WITHOUT Fresnel (what the visible
// shader multiplies sun irradiance by); fresnelR = 1 - waterEmissivity(dot(h, v)).
const float LWIR_SUN_E_TOA = 1.508;    // W m^-2, 8-14 um, at normal incidence
float sunGlintLWIR(float fresnelR, float specTerm, float sunElevSin, float Tair, float rh) {
  if (sunElevSin <= 0.0) return 0.0;
  return fresnelR * specTerm * LWIR_SUN_E_TOA * lwirAtmTransmittance(sunElevSin, Tair, rh);
}
// LWIR does NOT penetrate water: absorption coefficient ~ 4 pi k / lambda ~ 1e3 cm^-1, i.e.
// 1/e depth ~ 10-20 um. The sea surface is an opaque emitter/reflector in thermal mode: no
// refraction, subsurface or transmitted term, and anything below the waterline (submerged limbs,
// torso) must be completely invisible -- depth-test against the water surface, never blend.

// 5) Materials. Emissivities: human skin 0.98 (Steketee 1973; Sanchez-Marin et al. 2009), wet hair
// 0.97, wet fabric 0.95 (water film dominated), PU/PVC-coated nylon 0.88 (coated textiles 0.85-0.90).
const int LWIR_MAT_WATER = 0;
const int LWIR_MAT_FOAM = 1;
const int LWIR_MAT_FACE = 2;        // exposed facial skin, wet
const int LWIR_MAT_HAIR = 3;        // wet scalp hair
const int LWIR_MAT_HANDS = 4;       // wet hands / forearms above water
const int LWIR_MAT_WET_CLOTH = 5;   // soaked clothing at/just above the waterline
const int LWIR_MAT_LIFEJACKET = 6;  // inflated coated-nylon lifejacket, mostly dry upper part
float materialEmissivity(int m) {
  if (m == LWIR_MAT_WATER) return 0.984;   // nadir; use waterEmissivity(cos) per pixel
  if (m == LWIR_MAT_FOAM) return 0.99;
  if (m == LWIR_MAT_FACE || m == LWIR_MAT_HANDS) return 0.98;
  if (m == LWIR_MAT_HAIR) return 0.97;
  if (m == LWIR_MAT_WET_CLOTH) return 0.95;
  return 0.88;                              // lifejacket
}
// Sea skin temperature: cool-skin offset vs bulk (Donlon et al. 2002, J. Climate 15:353):
// dT = -0.14 - 0.30 exp(-u/3.7) K  (-0.44 K calm .. -0.16 K at 10 m/s).
float waterSkinTemp(float Twater, float windSpeed) {
  return Twater - 0.14 - 0.30 * exp(-max(windSpeed, 0.0) / 3.7);
}
// Steady surface energy balance, linearised (one equation for every person material):
//   K (Tdeep - T) + (hc + hr)(Tair - T) + hw (Twater - T) + alpha f S - Qsky
//     - w * 16.5 hc [ (1 - RH) e_s(Tair) + s (T - Tair) ] = 0
// K: tissue/insulation conductance to a deep temperature, hc = max(3, 8.3 u^0.6) forced
// convection (whole body, ISO 9920 / de Dear 1997), hr = 5.5 linearised radiation, hw = wave-wash
// coupling to water (80 W m^-2 K^-1 at the waterline -> 0 at 0.25 m), w = wetted fraction with
// Lewis relation 16.5 K/kPa, s = de_s/dT, RH assumed 0.8 (marine), Qsky = 30 W m^-2 net extra
// longwave loss to a cold sky for a ~50% sky view. f = orientation-averaged solar projection.
// Assumptions: core 37 C, person < ~1 h in water (no deep hypothermia), sunIrr = global
// horizontal irradiance (0 at night). Tuned outcomes at Tw 15 C / Ta 20 C / 5 m/s / night:
// face ~28 C (30 C at 2 m/s), hands ~21 C (cold vasoconstriction), wet hair ~18.5 C (below air,
// evaporation), wet cloth at waterline Tw + ~2 K, dry lifejacket Ta - 1 K (+5 K at 800 W m^-2).
float lwirEnergyBalance(float K, float Tdeep, float Tair, float hw, float Twater,
                        float w, float absSolar, float windSpeed) {
  const float lwirRH = 0.8;
  float hc = max(3.0, 8.3 * pow(max(windSpeed, 0.01), 0.6));
  float hcr = hc + 5.5;
  float tc = Tair - 273.15;
  float es = 0.6112 * exp(17.67 * tc / (tc + 243.5));                   // kPa
  float s = es * 17.67 * 243.5 / ((tc + 243.5) * (tc + 243.5));         // kPa/K
  float Le = w * 16.5 * hc;
  float num = K * Tdeep + hcr * Tair + hw * Twater + absSolar - 30.0
            - Le * (1.0 - lwirRH) * es + Le * s * Tair;
  return num / (K + hcr + hw + Le * s);
}
// heightAboveWaterline [m] (<0 = submerged), distToHeadCentre [m] (head radius ~0.1 m).
float personSurfaceTemp(int m, float heightAboveWaterline, float distToHeadCentre,
                        float Twater, float Tair, float windSpeed, float sunIrr) {
  float h = heightAboveWaterline;
  if (m == LWIR_MAT_WATER || h < 0.0) return waterSkinTemp(Twater, windSpeed); // opaque water wins
  if (m == LWIR_MAT_FOAM) return Twater + 0.05;   // foam destroys the cool skin: ~bulk
  float hw = 80.0 * (1.0 - smoothstep(0.0, 0.25, h));
  float S = max(sunIrr, 0.0);
  if (m == LWIR_MAT_FACE) {                        // well perfused, little vasoconstriction
    float T = lwirEnergyBalance(40.0, 309.65, Tair, hw, Twater, 0.15, 0.6 * 0.25 * S, windSpeed);
    return T - 2.5 * smoothstep(0.10, 0.13, distToHeadCentre);  // nose/ears protrude: colder
  }
  if (m == LWIR_MAT_HAIR)                          // insulating wet layer over 34 C scalp
    return lwirEnergyBalance(6.0, 307.15, Tair, hw, Twater, 1.0, 0.8 * 0.3 * S, windSpeed);
  if (m == LWIR_MAT_HANDS) {                       // cold-induced vasoconstriction below ~27 C water
    float K = mix(10.0, 30.0, smoothstep(285.0, 300.0, Twater));
    return lwirEnergyBalance(K, 309.65, Tair, hw, Twater, 0.5, 0.6 * 0.25 * S, windSpeed);
  }
  if (m == LWIR_MAT_WET_CLOTH)                     // skin under wet cloth sits between Tw and 37 C
    return lwirEnergyBalance(8.0, mix(Twater, 310.15, 0.5), Tair, hw, Twater, 1.0, 0.7 * 0.3 * S, windSpeed);
  // lifejacket: ~5-10 cm air bladder => K ~ 1.5; wet near the waterline, dry above
  float Tdry = lwirEnergyBalance(1.5, 306.15, Tair, hw, Twater, 0.1, 0.55 * 0.4 * S, windSpeed);
  float Twet = lwirEnergyBalance(1.5, 306.15, Tair, hw, Twater, 1.0, 0.55 * 0.4 * S, windSpeed);
  return mix(Twet, Tdry, smoothstep(0.05, 0.25, h));
}
// ===================== end LWIR physics =====================
`;
const THERM = {
  uThermal: { value: 0 }, uTwater: { value: 291.15 }, uTair: { value: 293.15 }, uRH: { value: 0.75 },
  uWindSpd: { value: 7 }, uSunIrr: { value: 0 }, uCloudFrac: { value: 0.4 }, uTcloud: { value: 281 },
};
const THERMAL_UNIFORMS_GLSL = 'uniform float uThermal, uTwater, uTair, uRH, uWindSpd, uSunIrr, uCloudFrac, uTcloud;\n';

// sky uniforms used by the sky, env and sun-illuminance shaders
const SKY_FUNCS = /* glsl */`
uniform sampler2D uTrans;
uniform sampler2D uSkyView;
uniform vec4 uSun;        // xyz towards the light (sun, or moon at night), w = illuminance scale
uniform float uCamAlt;    // km
uniform vec4 uCloud;      // low layer altitude km, coverage, optical density, time
uniform vec2 uVeil;       // high layer coverage, optical density
uniform vec2 uCamXZ;
uniform float uHaze;
float camR() { return RG + uCamAlt; }
vec3 sampleTrans(float r, float mu) { return texture(uTrans, transRMuToUV(r, mu)).rgb; }
vec2 skyViewUV(vec3 dir) {
  float r = camR();
  float cosBeta = rhoOf(r) / r;
  float beta = acos(clamp(cosBeta, -1.0, 1.0));
  float zha = PI - beta;
  float vzc = clamp(dir.y, -1.0, 1.0);
  vec2 uv;
  if (vzc >= -cosBeta) {
    float coord = acos(vzc) / zha;
    coord = 1.0 - sqrt(max(1.0 - coord, 0.0));
    uv.y = coord * 0.5;
  } else {
    float coord = (acos(vzc) - zha) / beta;
    uv.y = sqrt(max(coord, 0.0)) * 0.5 + 0.5;
  }
  float dl = length(dir.xz), sl = length(uSun.xz);
  float lvc = 1.0;
  if (dl > 1e-6 && sl > 1e-6) lvc = clamp(dot(dir.xz, uSun.xz) / (dl * sl), -1.0, 1.0);
  uv.x = sqrt(max(-lvc * 0.5 + 0.5, 0.0));
  return vec2(fromUnitToSubUvs(uv.x, SKY_W), fromUnitToSubUvs(uv.y, SKY_H));
}
vec3 skyAtmo(vec3 dir) { return texture(uSkyView, skyViewUV(dir)).rgb * uSun.w; }

const mat2 CLOUD_ROT = mat2(0.8, 0.6, -0.6, 0.8);
float cloudFbm(vec2 p, float fp, int oct, float billow) {
  float s = 0.0, a = 0.5, f = 1.0;
  vec2 q = p;
  for (int i = 0; i < 8; i++) {
    if (i >= oct) break;
    float w = 1.0 - smoothstep(0.08, 0.28, fp * f);
    float n = gnoise(q);
    if (i >= 2) n = mix(n, abs(n) * 2.0 - 0.38, billow);
    s += a * n * w;
    q = CLOUD_ROT * q * 2.03 + vec2(13.1, 7.7);
    f *= 2.03; a *= 0.5;
  }
  return s;
}
float lowEdge(vec2 q, float fp, int oct) {
  float t = uCloud.w;
  vec2 p = q * 0.38 + vec2(t * 0.004, t * 0.0012);
  vec2 w = vec2(gnoise(p * 0.3 + vec2(1.7, 9.2)), gnoise(p * 0.3 + vec2(8.3, 2.8)));
  p += w * 1.4;
  float base = cloudFbm(p * vec2(1.0, 1.7), fp * 0.65, oct, 0.35) * 1.3 + 0.5;
  float large = gnoise(q * 0.05 + vec2(3.1, 1.3)) * 0.7;
  return base + large - (1.0 - uCloud.y);
}
float lowSoft(float fp) { return 0.38 + min(fp * 0.65, 1.0) * 0.3; }
float lowDensity(vec2 q, float fp, int oct) { return clamp(lowEdge(q, fp, oct) / lowSoft(fp), 0.0, 1.0); }
float highEdge(vec2 q, float fp, int oct) {
  float t = uCloud.w;
  vec2 p = CLOUD_ROT * (q * vec2(0.09, 0.20)) + vec2(t * 0.0015, 0.0);
  float n = cloudFbm(p, fp * 0.2, oct, 0.0) * 1.25 + 0.5;
  float big = gnoise(q * 0.012 + vec2(7.0, 3.0)) * 0.6;
  return n + big - (1.0 - uVeil.x);
}
float highSoft(float fp) { return 0.85 + min(fp * 0.2, 1.0) * 0.3; }
float highDensity(vec2 q, float fp, int oct) { return clamp(highEdge(q, fp, oct) / highSoft(fp), 0.0, 1.0); }

struct CloudHit { float t; vec2 q; float mu; vec3 up; };
CloudHit hitLayer(vec3 dir, float hc) {
  CloudHit h;
  vec3 ro = vec3(0.0, camR(), 0.0);
  h.t = raySphere(ro, dir, RG + hc).y;
  vec3 p = ro + dir * h.t;
  h.up = p / length(p);
  h.q = p.xz + uCamXZ * 0.001;
  h.mu = max(dot(h.up, dir), 0.03);
  return h;
}
// d: density at the hit; s1..s3: densities further towards the sun
vec4 shadeLayer(vec3 dir, CloudHit h, float hc, float d, float s1, float s2, float s3, float sigma, float g) {
  float tau = d * sigma / h.mu;
  float alpha = 1.0 - exp(-tau);
  float tauS = (d * 0.5 + s1 * 0.6 + s2 + s3 * 0.7) * sigma * 0.55;
  float Ts = exp(-tauS);
  vec3 sunC = sampleTrans(RG + hc, dot(h.up, uSun.xyz)) * uSun.w;
  float cosT = dot(dir, uSun.xyz);
  float ph = mix(phaseHG(cosT, g), phaseHG(cosT, -0.2), 0.25);
  float fwd = smoothstep(-0.2, 0.7, cosT);
  vec3 single = sunC * Ts * ph * mix(alpha * 0.55, tau * exp(-tau) * 2.2, fwd) * 3.0;
  float rim = clamp((d - s1) * 2.5, 0.0, 1.0);
  float toward = smoothstep(-0.3, 0.9, cosT);
  vec3 ms = sunC * (0.025 + 0.22 * rim) * mix(1.0, Ts, 0.5) * alpha * (0.25 + 0.75 * toward);
  vec3 amb = (skyAtmo(normalize(vec3(dir.x, 0.03, dir.z))) * 0.26 + skyAtmo(vec3(0.0, 1.0, 0.0)) * 0.42)
             * alpha * (1.0 - 0.35 * d);
  return vec4(single + ms + amb, alpha);
}
// (premultiplied radiance, fraction of sky hidden); aa < 0 estimates edge width from the footprint
vec4 cloudLayers(vec3 dir, float pixAng, vec2 aa, out float sunT) {
  sunT = 1.0;
  if (dir.y <= 0.0) return vec4(0.0);
  vec2 sxz = uSun.xz / max(length(uSun.xz), 1e-4);
  vec4 lo = vec4(0.0);
  float loVis = 1.0;
  if (uCloud.y > 0.001) {
    float hc = uCloud.x;
    CloudHit h = hitLayer(dir, hc);
    float far = 1.0 - smoothstep(18.0, 36.0, h.t);
    if (far > 0.0) {
      float fp = h.t * pixAng / h.mu;
      float e = lowEdge(h.q, fp, 7);
      float d = clamp(e / lowSoft(fp), 0.0, 1.0) * far;
      if (d > 0.002) {
        float s1 = lowDensity(h.q + sxz * 0.08, fp, 5) * far;
        float s2 = lowDensity(h.q + sxz * 0.25, fp, 4) * far;
        float s3 = lowDensity(h.q + sxz * 0.6, fp, 3) * far;
        lo = shadeLayer(dir, h, hc, d, s1, s2, s3, uCloud.z, 0.75);
        float aw = aa.x >= 0.0 ? aa.x : fp * 0.38 * 2.5;
        lo *= smoothstep(0.0, aw * 1.5 + 1e-6, e);
        loVis = exp(-h.t * 0.02 * (0.6 + 0.4 * uHaze));
      }
    }
  }
  vec4 hi = vec4(0.0);
  float hiVis = 1.0;
  if (uVeil.x > 0.001) {
    float hc = 4.5;
    CloudHit h = hitLayer(dir, hc);
    float far = 1.0 - smoothstep(30.0, 70.0, h.t);
    if (far > 0.0) {
      float fp = h.t * pixAng / h.mu;
      float e = highEdge(h.q, fp, 6);
      float d = clamp(e / highSoft(fp), 0.0, 1.0) * far;
      if (d > 0.002) {
        float s1 = highDensity(h.q + sxz * 0.15, fp, 4) * far;
        float s2 = highDensity(h.q + sxz * 0.5, fp, 3) * far;
        hi = shadeLayer(dir, h, hc, d, s1, s2, s2, uVeil.y, 0.80);
        float aw = aa.y >= 0.0 ? aa.y : fp * 0.2 * 2.5;

// Ocean surface

function makeOceanGeometry(rings = 380, segs = 512, rMin = 0.05, rMax = 20000) {
  const pos = [0, 0, 0], idx = [];
  for (let i = 0; i < rings; i++) {
    const r = rMin * Math.pow(rMax / rMin, i / (rings - 1));
    for (let j = 0; j < segs; j++) { const a = j / segs * Math.PI * 2; pos.push(r * Math.cos(a), 0, r * Math.sin(a)); }
  }
  const v = (i, j) => 1 + i * segs + (j % segs);
  for (let j = 0; j < segs; j++) idx.push(0, v(0, j + 1), v(0, j));
  for (let i = 0; i < rings - 1; i++) for (let j = 0; j < segs; j++) {
    const a = v(i, j), b = v(i, j + 1), c = v(i + 1, j), d = v(i + 1, j + 1);
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return { geo: g, lodK: Math.pow(rMax / rMin, 1 / (rings - 1)) - 1 };

    if (lod < 8.0) disp += textureLod(uDisp${c}, xz / uCascL[${c}], lod).xyz; }`)}

const LAT = 32 * D2R, DECL = 12 * D2R;

function updateSky() {
  const H = (params.timeOfDay - 12) * 15 * D2R;
  const sinEl = Math.sin(LAT) * Math.sin(DECL) + Math.cos(LAT) * Math.cos(DECL) * Math.cos(H);
  const el = Math.asin(sinEl);
  const b = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(LAT) - Math.tan(DECL) * Math.cos(LAT)) + Math.PI;
  sunDir.set(Math.cos(el) * Math.sin(b), sinEl, -Math.cos(el) * Math.cos(b));
  sunElDeg = el * R2D;
  nightF = 1 - smoothstep(-0.12, -0.02, sinEl);
  // below about -3 deg the moon (opposite azimuth, 38 deg up) lights the scene instead
  const useMoon = sunElDeg < -3;
  if (useMoon) lightDir.set(-sunDir.x, 0, -sunDir.z).normalize().multiplyScalar(Math.cos(38 * D2R)).setY(Math.sin(38 * D2R));
  else lightDir.copy(sunDir);
  const W = useMoon ? 14 * 0.004 : 14;
  skyU.uSun.value.set(lightDir.x, lightDir.y, lightDir.z, W);
  skyU.uHaze.value = params.haze;
  skyU.uCloud.value.y = params.volClouds ? 0 : params.clouds;   // the flat low layer gives way to the volumetric clouds
  skyU.uVeil.value.x = params.veil;
  skyU.uNight.value = nightF;
  skyU.uWaterCol.value.set(oceanU.uWaterCol.value.x, oceanU.uWaterCol.value.y, oceanU.uWaterCol.value.z);
  if (lutDirty) {
    transMat.uniforms.uHaze.value = msMat.uniforms.uHaze.value = skyViewMat.uniforms.uHaze.value = params.haze;
    runPass(transMat, transRT);
    runPass(msMat, msRT);

  }

  runPass(skyViewMat, skyViewRT);

  const fe = oceanU.uFogExt.value;
  fe.set((5.802e-3 + 4.4e-3 * params.haze) * 1e-3 * params.fog, (13.558e-3 + 4.4e-3 * params.haze) * 1e-3 * params.fog,
    (33.1e-3 + 4.4e-3 * params.haze) * 1e-3 * params.fog, 1.1e-4 * params.fog);

}

function refreshEnv() {

  const camXZ = skyU.uCamXZ.value.clone();
  skyU.uCamXZ.value.set(controls.target.x, controls.target.z);

  const collar = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(collarPts), 64, collarR, 16), pfd);
  group.add(collar);
  for (const sgn of [1, -1]) {
    // wide, flattened bladder down each side of the chest
    const top = P(chest, sgn * sw, 0.12, 0.1), bot = P(chest, sgn * sw * 0.85, 0.13, -0.2);
    const axis = top.clone().sub(bot).normalize();
    const side = new THREE.Vector3().crossVectors(axis, f).normalize();
    const lobe = new THREE.Mesh(new THREE.CapsuleGeometry(lobeR, top.distanceTo(bot), 8, 20), pfd);
    lobe.position.copy(top).add(bot).multiplyScalar(0.5);
    lobe.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(side, axis, new THREE.Vector3().crossVectors(side, axis)));
    lobe.scale.set(1.45, 1, 0.72);
    group.add(lobe);
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.024, 0.01), tape);
    strip.position.copy(P(chest, sgn * sw, 0.182, -0.04));
    strip.quaternion.copy(lobe.quaternion);
    group.add(strip);
  }
  // waist belt
  const beltC = P(belly, 0, 0.0, -0.06);
  const belt = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 6, 40), strap);
  belt.position.copy(beltC);
  const m = new THREE.Matrix4().makeBasis(l, f, up);
  belt.quaternion.setFromRotationMatrix(m);
  belt.scale.set(width * 0.5, 0.15, 1);
  group.add(belt);
  // SOLAS light on the left lobe
  const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0 });
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), bulbMat);
  bulb.position.copy(P(chest, sw, 0.17, 0.15));
  group.add(bulb);
  return { group, bulb, bulbMat, materials: [pfd, tape, strap, bulbMat] };
}

// --- wet look: darker, glossier below and just above the local waterline
// thermal classes (LWIR_MAT_*): 2 face, 3 hair, 4 hands, 5 wet clothing, 6 lifejacket; 7 = mixed texture (face near the head)
function makeWet(mat, wetU, dark, cls) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uWaterPlane = wetU.plane;
    sh.uniforms.uWetBase = wetU.base;
    sh.uniforms.uWetDark = { value: dark };
    sh.uniforms.uHeadPos = wetU.head;
    sh.uniforms.uMatClass = { value: cls };
    Object.assign(sh.uniforms, THERM);
    sh.vertexShader = 'varying vec3 vWetPos;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  vWetPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'varying vec3 vWetPos;\nuniform vec4 uWaterPlane;\nuniform float uWetBase;\nuniform float uWetDark;\n' +
      'uniform vec3 uHeadPos;\nuniform float uMatClass;\n' + THERMAL_UNIFORMS_GLSL + THERMAL_GLSL + sh.fragmentShader
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
  if (uThermal > 0.5) {
    float dHead = distance(vWetPos, uHeadPos);
    int cls = int(uMatClass + 0.5);
    if (cls == 7) cls = dHead < 0.13 ? LWIR_MAT_FACE : LWIR_MAT_WET_CLOTH;   // single-texture model
    float Tsurf = personSurfaceTemp(cls, wetH, dHead, uTwater, uTair, uWindSpd, uSunIrr);
    float em = materialEmissivity(cls);
    vec3 nW = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
    vec3 rW = reflect(normalize(vWetPos - cameraPosition), nW);
    float Lsky = skyRadianceLWIR(max(rW.y, 0.0), uTair, uRH, uCloudFrac, uTcloud);
    float tau = pathTransmittanceLWIR(length(vViewPosition), uRH, uTair);
    gl_FragColor = vec4((em * planckBand(Tsurf) + (1.0 - em) * Lsky) * tau + planckBand(uTair) * (1.0 - tau), 0.0, 0.0, 1.0);
  }`)
      .replace('#include <map_fragment>', `#include <map_fragment>
  float wetH = dot(uWaterPlane.xyz, vWetPos) + uWaterPlane.w;
  float wetN = fract(sin(dot(floor(vWetPos.xz * 30.0 + vWetPos.y * 17.0), vec2(12.9898, 78.233))) * 43758.5453);
  float wetness = max(uWetBase, 1.0 - smoothstep(0.02, 0.14 + 0.1 * wetN, wetH));
  diffuseColor.rgb *= mix(1.0, uWetDark, wetness);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
  roughnessFactor = mix(roughnessFactor, roughnessFactor * 0.3 + 0.05, wetness);`);
    for (const h of HOOKS.personShader) h(sh, mat, cls);   // feature modules: extra person-material code
  };
  mat.customProgramCacheKey = () => 'wet-thermal';
}

function prepareTemplate(gltf, def) {

}
const GLOW_TEX = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.2, 'rgba(255,255,255,0.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);

})();
const PROBE_GEO = new THREE.SphereGeometry(0.04, 10, 8);

function createPerson(tpl) {
  const def = tpl.def;
  const root = new THREE.Group();          // physics body frame (origin = centre of mass)
  const poseRoot = new THREE.Group();      // body frame offset so the COM sits at the origin
  root.add(poseRoot);
  const model = SkeletonUtils.clone(tpl.scene);
  const holder = new THREE.Group();
  holder.scale.setScalar(tpl.scale);
  holder.add(model);
  poseRoot.add(holder);
  const wetU = { plane: { value: new THREE.Vector4(0, 1, 0, 0) }, base: { value: 0.45 }, head: { value: new THREE.Vector3() } };
  const mats = [];
  model.traverse(o => {
    if (!o.isMesh) return;
    if (o.name === 'Wolf3D_Headwear') { o.visible = false; return; }   // a fedora does not stay on in the water
    o.frustumCulled = false;
    o.layers.enable(PEOPLE_LAYER);
    o.material = [].concat(o.material).map(m => {
      const c = m.clone();
      const dark = def.wet[m.name] ?? (/Skin|Body|Ch03/.test(m.name) ? 0.8 : 0.5);
      if (/Outfit_Top/.test(m.name)) c.color.multiply(new THREE.Color(pick([0xffffff, 0x8899cc, 0x666666, 0xcc7777, 0x77aa88])));
      if (def.alphaTest !== undefined) c.alphaTest = def.alphaTest;
      if (def.metalness !== undefined) c.metalness = def.metalness;
      const cls = /Beard|Hair/.test(m.name) ? 3 : /Outfit/.test(m.name) ? 5 : /Wolf3D_Body/.test(m.name) ? 4 : /Skin|Eye|Teeth/.test(m.name) ? 2 : 7;
      makeWet(c, wetU, dark, cls);
      mats.push(c);
      return c;
    })[0];
  });
  const P = {
    root, poseRoot, model, mats, wetU, rig: buildRig(holder, def.prefix), aimVecs: new Map(),
    scullW: rand(1.6, 2.4), scullPh: Math.random() * 6.28, headYaw: rand(-0.4, 0.4), strobePh: Math.random(),
    mass: rand(def.mass[0], def.mass[1]),
    pos: new THREE.Vector3(), vel: new THREE.Vector3(), w: new THREE.Vector3(),
    q: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI * 2),
  };
  P.headBones = [P.rig.byName('Head'), P.rig.byName('HeadTop_End') || P.rig.byName('Head')];
  setAims(P, 0);
  solvePose(P.rig);
  holder.updateMatrixWorld(true);

  // lifejacket
  const jk = buildJacket(P.rig, pick(PFD_COLORS));
  jk.group.traverse(o => { if (o.isMesh) o.layers.enable(PEOPLE_LAYER); });
  jk.materials.forEach((m, k) => { makeWet(m, wetU, 0.92, k === 2 ? 5 : 6); mats.push(m); });
  poseRoot.add(jk.group);
  P.bulbMat = jk.bulbMat;
  P.glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_TEX, color: 0xfff6e0, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  P.glow.position.copy(jk.bulb.position); P.glow.scale.setScalar(0.35);
  poseRoot.add(P.glow);
  mats.push(P.glow.material);

  // buoyancy probes from the posed skeleton (volumes scaled with body mass; ~150 N inflated jacket at the chest/collar)
  const bp = n => { const b = P.rig.byName(n); return b ? b.getWorldPosition(new THREE.Vector3()) : null; };
  const mid = (a, b) => bp(a).add(bp(b)).multiplyScalar(0.5);
  const headTop = bp('HeadTop_End') || bp('Head').add(new THREE.Vector3(0, 0.18, 0));
  const vs = P.mass / 88;
  const list = [
    [bp('Head').lerp(headTop, 0.45), 0.105, 0.0055 * vs], [bp('Neck'), 0.12, 0.011], [bp('Spine2'), 0.17, 0.030 * vs],
    [bp('Spine'), 0.15, 0.020 * vs], [bp('Hips'), 0.15, 0.017 * vs],
    [mid('LeftUpLeg', 'LeftLeg'), 0.085, 0.0055 * vs], [mid('RightUpLeg', 'RightLeg'), 0.085, 0.0055 * vs],
    [mid('LeftLeg', 'LeftFoot'), 0.06, 0.0035 * vs], [mid('RightLeg', 'RightFoot'), 0.06, 0.0035 * vs],
    [bp('LeftForeArm'), 0.045, 0.0012 * vs], [bp('RightForeArm'), 0.045, 0.0012 * vs],
  ];
  // equilibrium: water level where buoyancy = weight, then put the COM a little below the centre of buoyancy
  const buoy = y => list.reduce((s, [p, r, V]) => s + RHO * V * capFraction(y - p.y, r), 0);
  let lo = -2, hi = 2;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (buoy(m) < P.mass) lo = m; else hi = m; }
  const yW = (lo + hi) / 2, cob = new THREE.Vector3();
  let vsum = 0;
  for (const [p, r, V] of list) { const v = V * capFraction(yW - p.y, r); cob.addScaledVector(p, v); vsum += v; }
  cob.divideScalar(vsum);
  const com = cob.clone().add(new THREE.Vector3(0, -0.09, 0));
  poseRoot.position.copy(com).negate();
  P.probes = list.map(([p, r, V]) => ({ local: p.clone().sub(com), r, V, area: Math.PI * r * r }));
  P.Vtot = list.reduce((s, l) => s + l[2], 0);
  P.depth = new Float64Array(P.probes.length); P.frac = new Float64Array(P.probes.length); P.sub = 0;
  P.ix = P.mass * 0.24; P.iy = P.mass * 0.05;       // rough principal inertias (kg m^2)
  P.probeGroup = new THREE.Group(); P.probeGroup.visible = params.showProbes; root.add(P.probeGroup);
  P.probeMats = P.probes.map(pr => {
    const m = new THREE.MeshBasicMaterial({ color: 0xff3030, depthTest: false, transparent: true });
    const s = new THREE.Mesh(PROBE_GEO, m); s.position.copy(pr.local); s.renderOrder = 10; P.probeGroup.add(s);
    mats.push(m); return m;
  });
  return P;
}

const people = [];
function groupCentroid(out) {
  out.set(0, 0, 0);
  if (!people.length) return out;
  people.forEach(P => out.add(P.pos));
  return out.divideScalar(people.length).setY(0);
}
// a spot around (cx, cz) at least 2.2 m from everyone already placed (ring widens if it is crowded)
function freeSpot(cx, cz, placed, out) {
  for (let k = 0; k < 60; k++) {
    const a = Math.random() * Math.PI * 2, r = placed.length ? rand(2.5, 10 + k * 0.2) : 0;
    out.set(cx + r * Math.cos(a), -0.4, cz + r * Math.sin(a));
    if (placed.every(q => Math.hypot(q.x - out.x, q.z - out.z) > 2.2)) break;
  }
  return out;
}
function addPerson() {
  if (!templates.length) return;
  const P = createPerson(templates[people.length % templates.length]);
  const c = groupCentroid(new THREE.Vector3());
  freeSpot(c.x, c.z, people.map(Q => Q.pos), P.pos);
  scene.add(P.root);
  people.push(P);
}
function removePerson() {
  const P = people.pop();
  scene.remove(P.root);
  P.mats.forEach(m => m.dispose());
}
function setPeopleCount(n) {
  n = clamp(Math.round(n), 0, MAX_PEOPLE);
  while (people.length < n && templates.length) addPerson();
  while (people.length > n) removePerson();
}
function respawn() {
  const placed = [];
  people.forEach(P => {
    freeSpot(0, 0, placed, P.pos); P.vel.set(0, 0, 0); P.w.set(0, 0, 0);
    placed.push(P.pos);
  });
  controls.target.set(0, 0, 0);
  placeCamera();
}

// --- rigid-body buoyancy using the GPU surface probes (sampled once per frame, extrapolated between substeps)
const _r = new THREE.Vector3(), _pv = new THREE.Vector3(), _F = new THREE.Vector3(), _T = new THREE.Vector3();
const _n = new THREE.Vector3(), _up = new THREE.Vector3(), _qi = new THREE.Quaternion(), _dq = new THREE.Quaternion();
const CD = 1.0, C_LIN = 45, C_ANG = 10, K_ALIGN = 30, ADDED = 0.45;
function writeQueries() {
  people.forEach((P, pi) => {
    const base = pi * PROBES_PER;
    P.probes.forEach((pr, i) => {
      _r.copy(pr.local).applyQuaternion(P.q).add(P.pos);
      queryData[(base + i) * 4] = _r.x; queryData[(base + i) * 4 + 1] = _r.z;
      pr.sx0 = _r.x; pr.sz0 = _r.z;
    });
    queryData[(base + PROBES_PER - 1) * 4] = P.pos.x; queryData[(base + PROBES_PER - 1) * 4 + 1] = P.pos.z;
  });
  queryData[CAM_PROBE * 4] = camera.position.x; queryData[CAM_PROBE * 4 + 1] = camera.position.z;
}
function stepPerson(P, pi, dt, t) {
  const m = P.mass, base = pi * PROBES_PER, kp = sea.kp, dts = t - probeTime;
  _F.set(0, -m * G, 0); _T.set(0, 0, 0);
  let Vsub = 0;
  P.probes.forEach((pr, i) => {
    const s = probe(base + i);
    _r.copy(pr.local).applyQuaternion(P.q);
    const px = P.pos.x + _r.x, py = P.pos.y + _r.y, pz = P.pos.z + _r.z;
    const h = s.h + s.vy * dts + s.sx * (px - pr.sx0) + s.sz * (pz - pr.sz0);
    const depth = h - py;
    P.depth[i] = Math.max(0, depth);
    const frac = capFraction(depth, pr.r);
    P.frac[i] = frac;
    const vol = pr.V * frac;
    Vsub += vol;
    _pv.crossVectors(P.w, _r).add(P.vel);
    let fx = 0, fy = RHO * G * vol, fz = 0;
    if (frac > 0) {
      const dec = Math.exp(-kp * P.depth[i]);
      const rx = _pv.x - (s.vx * dec + sea.current.x), ry = _pv.y - s.vy * dec, rz = _pv.z - (s.vz * dec + sea.current.z);
      const c = (0.5 * RHO * CD * pr.area * Math.hypot(rx, ry, rz) + C_LIN) * frac;
      fx -= c * rx; fy -= c * ry; fz -= c * rz;
    }
    if (frac < 1) {
      const ax = sea.wind.x - _pv.x, az = sea.wind.z - _pv.z;
      const c = 0.5 * RHO_AIR * 1.1 * pr.area * (1 - frac) * Math.hypot(ax, az);
      fx += c * ax; fz += c * az;
    }
    _F.x += fx; _F.y += fy; _F.z += fz;
    _T.x += _r.y * fz - _r.z * fy; _T.y += _r.z * fx - _r.x * fz; _T.z += _r.x * fy - _r.y * fx;
  });
  P.sub = Vsub / P.Vtot;
  // wave-slope pressure turns the body with the local surface normal
  const sc = probe(base + PROBES_PER - 1);
  _up.set(0, 1, 0).applyQuaternion(P.q);
  _n.set(-sc.sx, 1, -sc.sz).normalize();
  _T.addScaledVector(_n.crossVectors(_up, _n), K_ALIGN * P.sub);
  _T.addScaledVector(P.w, -C_ANG);
  _T.y += 0.8 * Math.sin(t * 0.13 + P.scullPh);
  // soft horizontal contact between people (bodies and jackets ~1.4 m apart at the closest)
  for (const Q of people) {
    if (Q === P) continue;
    const dx = P.pos.x - Q.pos.x, dz = P.pos.z - Q.pos.z, d = Math.hypot(dx, dz);
    if (d < 1.4 && d > 1e-4) { const f = (1.4 - d) * 600 / d; _F.x += dx * f; _F.z += dz * f; }
  }
  const madd = ADDED * RHO * Vsub, s = 1 + madd / m;
  P.vel.addScaledVector(_F, dt / (m + madd));
  if (P.vel.lengthSq() > 400) P.vel.setLength(20);
  P.pos.addScaledVector(P.vel, dt);
  _qi.copy(P.q).invert();
  _T.applyQuaternion(_qi);
  _pv.copy(P.w).applyQuaternion(_qi);
  _pv.x += _T.x / (P.ix * s) * dt; _pv.y += _T.y / (P.iy * s) * dt; _pv.z += _T.z / (P.ix * s) * dt;
  P.w.copy(_pv.applyQuaternion(P.q));
  if (P.w.lengthSq() > 100) P.w.setLength(10);
  _dq.set(P.w.x * dt * 0.5, P.w.y * dt * 0.5, P.w.z * dt * 0.5, 0).multiply(P.q);
  P.q.set(P.q.x + _dq.x, P.q.y + _dq.y, P.q.z + _dq.z, P.q.w + _dq.w).normalize();
}

const PIP_VERT = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const rgbOutMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rgbRT.texture }, uExposure: { value: 1 }, uFrame: { value: 0 }, uAspect: { value: SENSOR_W / SENSOR_H } },
  vertexShader: PIP_VERT, fragmentShader: compositePass.material.fragmentShader, depthTest: false, depthWrite: false,
});
// ---- LWIR microbolometer camera model (written for this file by a helper agent; inlined module) ----
// thermal_sensor.js — uncooled LWIR microbolometer camera model (Boson/Tau-class 640x512 @ 30 Hz)
// for a picture-in-picture "IR camera" window. three.js r169, WebGL2, GLSL ES 3.00.
//
// Pipeline (per frame):
//   1. Render the scene's in-band LWIR radiance (R channel) into a full-res render target `rad`.
//   2. Downsample pass (THERMAL_DOWNSAMPLE_FRAG) -> small FloatType target `small` (e.g. 80x64):
//        R = apparent temperature (K, box-averaged radiance), G = mean input value, B = max temp (K).
//   3. renderer.readRenderTargetPixels(small, 0, 0, 80, 64, buf) -> agc.update(buf, dt) -> agc.applyTo(u)
//      (readback stalls ~0.1-0.5 ms; doing it every 2nd-4th frame is fine given the ~0.7 s AGC time constant).
//   4. Sensor pass (THERMAL_SENSOR_FRAG) into the PIP sub-rectangle via setViewport/setScissor.
//
// Material setup (both passes):
//   new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: THERMAL_FULLSCREEN_VERT,
//     fragmentShader: BAND_TEMP_GLSL + THERMAL_SENSOR_FRAG, uniforms, depthTest: false, depthWrite: false })
//   on a Mesh(new THREE.PlaneGeometry(2, 2)) with frustumCulled = false.
//   If the R channel already holds kelvin, set material.defines = { INPUT_IS_KELVIN: '' } on BOTH passes
//   (then bandTemp is not referenced and need not be concatenated).
//
// Precision notes: a HalfFloat radiance target is fine (~0.04 K quantisation at 300 K, dithered by NETD),
// but kelvin stored in HalfFloat quantises to 0.25 K — use FloatType when INPUT_IS_KELVIN.
// The small target must be FloatType for Float32Array readback; the shader reads it with texelFetch,
// so it works with or without OES_texture_float_linear.


// ---------------------------------------------------------------------------------------------
// Shared GLSL: input conversion + sensor-FOV crop (sensor aspect is centre-cropped out of the
// radiance target; uZoom > 1 is digital zoom).
// ---------------------------------------------------------------------------------------------
const COMMON_GLSL = /* glsl */ `
uniform sampler2D uRadiance;   // R: in-band radiance (W m^-2 sr^-1) or kelvin with INPUT_IS_KELVIN
uniform vec2  uSensorRes;      // native focal-plane array size, e.g. 640x512
uniform float uZoom;           // digital zoom (1 = full sensor FOV)

#ifdef INPUT_IS_KELVIN
#define TS_TO_K(x) (x)
#else
#define TS_TO_K(x) bandTemp(x)
#endif

// scale from sensor uv to radiance-target uv (centre crop to the sensor aspect)
vec2 ts_srcScale() {
  vec2 src = vec2(textureSize(uRadiance, 0));
  float aSrc = src.x / src.y;
  float aSen = uSensorRes.x / uSensorRes.y;
  vec2 k = (aSrc > aSen) ? vec2(aSen / aSrc, 1.0) : vec2(1.0, aSrc / aSen);
  return k / max(uZoom, 1e-3);
}
vec2 ts_srcUV(vec2 s, vec2 k) { return 0.5 + (s - 0.5) * k; }
`;

/** Pass-through vertex shader for a PlaneGeometry(2,2) quad (ignores the camera). */
const THERMAL_FULLSCREEN_VERT = /* glsl */ `
void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// ---------------------------------------------------------------------------------------------
// Downsample for AGC statistics: each output texel box-filters its cell of the sensor FOV with
// 8x8 bilinear taps, averages *radiance* (physically correct "apparent temperature"), then converts.
// ---------------------------------------------------------------------------------------------
const THERMAL_DOWNSAMPLE_FRAG = COMMON_GLSL + /* glsl */ `
layout(location = 0) out vec4 fragColor;
uniform vec2 uOutRes;          // size of this render target, e.g. 80x64

void main() {
  vec2 k = ts_srcScale();
  vec2 cell = 1.0 / uOutRes;
  vec2 cell0 = floor(gl_FragCoord.xy) * cell;           // sensor-uv corner of this cell
  float sumL = 0.0;
  float maxL = -1e30;
  for (int j = 0; j < 8; j++) {
    for (int i = 0; i < 8; i++) {
      vec2 s = cell0 + (vec2(float(i), float(j)) + 0.5) * 0.125 * cell;
      float L = texture(uRadiance, ts_srcUV(s, k)).r;
      sumL += L;
      maxL = max(maxL, L);
    }
  }
  float Lm = sumL * (1.0 / 64.0);
  fragColor = vec4(TS_TO_K(Lm), Lm, TS_TO_K(maxL), 1.0);   // R: apparent K, G: mean input, B: max K
}
`;

// ---------------------------------------------------------------------------------------------
// Sensor model
// ---------------------------------------------------------------------------------------------
const THERMAL_SENSOR_FRAG = COMMON_GLSL + /* glsl */ `
layout(location = 0) out vec4 fragColor;

uniform vec4  uViewport;   // PIP rect in drawing-buffer px (x, y from bottom-left, w, h) = CSS px * pixelRatio
uniform float uFill;       // 0 = letterbox the whole sensor image, 1 = fill window (crop)
uniform sampler2D uSmall;  // downsample target (G = mean input), used for the wide scatter halo; optional
uniform float uFrame;      // frame counter (temporal noise seed)
uniform float uLow;        // AGC window low  (K)
uniform float uHigh;       // AGC window high (K)
uniform float uCurve[17];  // AGC transfer curve knots (plateau equalisation), identity by default
uniform float uCurveMix;   // 0 = linear AGC, 1 = full curve
uniform float uNETD;       // temporal noise, K rms at 300 K scene
uniform float uFPN;        // fixed-pattern residual strength (1 = typical after NUC)
uniform float uFFC;        // 0 right after flat-field correction ... 1 = fully drifted
uniform float uTref;       // shutter temperature at last FFC (gain residual pivots here), K
uniform float uVignette;   // radial non-uniformity, K at the corners (positive = cooler edges)
uniform float uBlur;       // optics/pixel MTF tap spacing in sensor px (0 = none)
uniform float uGlow;       // fraction of energy scattered into a wide halo
uniform float uDDE;        // local-contrast (digital detail enhancement) gain
uniform int   uPalette;    // 0 white-hot, 1 black-hot, 2 ironbow, 3 rainbow-HC
uniform float uOSD;        // 1 = draw crosshair + palette bar

// ---- stable hashing / Gaussian noise ----
uint ts_hash(uint x) {
  x ^= x >> 16u; x *= 0x7feb352du;
  x ^= x >> 15u; x *= 0x846ca68bu;
  x ^= x >> 16u; return x;
}
float ts_u01(uint h) { return (float(h >> 8u) + 0.5) * (1.0 / 16777216.0); }   // (0,1)
float ts_gauss(uint h) {                                                         // N(0,1), Box-Muller
  float a = ts_u01(ts_hash(h));
  float b = ts_u01(ts_hash(h ^ 0x9e3779b9u));
  return sqrt(-2.0 * log(a)) * cos(6.2831853 * b);
}
uint ts_seed(ivec2 p, uint salt) { return ts_hash(uint(p.x) ^ ts_hash(uint(p.y) ^ ts_hash(salt))); }

// NETD grows for colder scenes: noise is constant in radiance, so dT = dL / (dL/dT).
// Planck dB/dT at 10 um ~ x^2 e^x / (e^x - 1)^2, x = c2/(lambda T); normalised to 300 K.
float ts_netdScale(float T) {
  float x = 1438.777 / clamp(T, 150.0, 600.0);
  float e = exp(x);
  float d = x * x * e / ((e - 1.0) * (e - 1.0));
  return clamp(0.193245 / d, 0.25, 4.0);
}

// manual bilinear fetch of the small target's G channel (works without float-linear filtering)
float ts_smallG(vec2 uv) {
  ivec2 sz = textureSize(uSmall, 0);
  ivec2 mx = sz - 1;
  vec2 p = uv * vec2(sz) - 0.5;
  vec2 fl = floor(p);
  vec2 f = p - fl;
  ivec2 i0 = ivec2(fl);
  float t00 = texelFetch(uSmall, clamp(i0,               ivec2(0), mx), 0).g;
  float t10 = texelFetch(uSmall, clamp(i0 + ivec2(1, 0), ivec2(0), mx), 0).g;
  float t01 = texelFetch(uSmall, clamp(i0 + ivec2(0, 1), ivec2(0), mx), 0).g;
  float t11 = texelFetch(uSmall, clamp(i0 + ivec2(1, 1), ivec2(0), mx), 0).g;
  return mix(mix(t00, t10, f.x), mix(t01, t11, f.x), f.y);
}

float ts_curve(float x) {                      // piecewise-linear AGC transfer curve
  float f = clamp(x, 0.0, 1.0) * 16.0;
  int i = min(int(f), 15);
  return mix(uCurve[i], uCurve[i + 1], f - float(i));
}

vec3 ts_hsv(float h, float s, float v) {
  vec3 k = clamp(abs(fract(h + vec3(0.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0) - 1.0, 0.0, 1.0);
  return v * mix(vec3(1.0), k, s);
}

vec3 ts_palette(float t) {
  t = clamp(t, 0.0, 1.0);
  if (uPalette == 1) return vec3(1.0 - t);                                  // black-hot
  if (uPalette == 2) {                                                      // ironbow: black-indigo-magenta-orange-yellow-white
    float r = smoothstep(0.05, 0.55, t);
    float g = pow(clamp((t - 0.35) / 0.6, 0.0, 1.0), 1.2);
    float b = 0.55 * sin(3.14159265 * clamp(t * 2.0, 0.0, 1.0)) + smoothstep(0.82, 1.0, t);
    return clamp(vec3(r, g, b), 0.0, 1.0);
  }
  if (uPalette == 3) {                                                      // rainbow-HC: violet->red, white top
    return ts_hsv(0.75 * (1.0 - min(t / 0.92, 1.0)), 1.0 - smoothstep(0.92, 1.0, t),
                  0.3 + 0.7 * smoothstep(0.0, 0.25, t));
  }
  return vec3(t);                                                           // white-hot
}

void main() {
  // ---- window -> sensor uv (letterbox or crop by aspect) ----
  vec2 win = (gl_FragCoord.xy - uViewport.xy) / uViewport.zw;
  float aWin = uViewport.z / uViewport.w;
  float aSen = uSensorRes.x / uSensorRes.y;
  vec2 fFit = (aWin > aSen) ? vec2(aWin / aSen, 1.0) : vec2(1.0, aSen / aWin);
  vec2 f = (uFill > 0.5) ? fFit / max(fFit.x, fFit.y) : fFit;
  vec2 s = 0.5 + (win - 0.5) * f;
  if (any(lessThan(s, vec2(0.0))) || any(greaterThan(s, vec2(1.0)))) {
    fragColor = vec4(0.015, 0.015, 0.015, 1.0);                             // letterbox bars
    return;
  }
  vec2 rectPx = uViewport.zw / f;                                           // on-screen size of full image

  // ---- pixelation: everything is evaluated at the detector pixel centre ----
  ivec2 px = clamp(ivec2(floor(s * uSensorRes)), ivec2(0), ivec2(uSensorRes) - 1);
  vec2 c = (vec2(px) + 0.5) / uSensorRes;
  vec2 k = ts_srcScale();
  vec2 dS = k / uSensorRes;                                                 // one sensor px in source uv
  vec2 base = ts_srcUV(c, k);

  // ---- optics MTF + pixel aperture: 3x3 binomial in radiance (linear in flux) ----
  float Lc = 0.0;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      float w = (i == 0 ? 2.0 : 1.0) * (j == 0 ? 2.0 : 1.0);
      Lc += w * texture(uRadiance, base + vec2(float(i), float(j)) * uBlur * dS).r;
    }
  }
  Lc *= 1.0 / 16.0;

  // near ring (r = 2.5 px): local background for DDE and near-field scatter
  float Lr = 0.0;
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.78539816 + 0.39269908;
    Lr += texture(uRadiance, base + vec2(cos(a), sin(a)) * 2.5 * dS).r;
  }
  Lr *= 0.125;

  // ---- stray-light halo: energy-conserving mix toward a wide blur; hot objects glow because the
  //      mix is in radiance (steep in T). Wide part comes from the 80x64 target (~8-16 px kernel). ----
  float Lo = Lc;
  if (uGlow > 0.0 && textureSize(uSmall, 0).x > 1) {
    Lo = Lc + uGlow * (0.35 * Lr + 0.65 * ts_smallG(c) - Lc);
  }
  float T  = TS_TO_K(Lo);                                                   // scene apparent temperature
  float Tb = TS_TO_K(Lo + 0.75 * (Lr - Lc));                                // local background (DDE)

  // ---- temporal noise (white per pixel + weak per-frame row noise), in K ----
  uint fr = uint(uFrame);
  float nT = uNETD * ts_netdScale(T) *
             (ts_gauss(ts_seed(px, fr * 2u + 1u)) + 0.2 * ts_gauss(ts_seed(ivec2(0, px.y), fr * 2u + 2u)));

  // ---- fixed pattern after NUC: column offsets, pixel offsets, pixel gain residual (pivots at the
  //      shutter temperature), plus offset drift accumulating since the last FFC ----
  float gCol  = ts_gauss(ts_seed(ivec2(px.x, 0), 101u));
  float gPix  = ts_gauss(ts_seed(px, 202u));
  float gGain = ts_gauss(ts_seed(px, 303u));
  float gDCol = ts_gauss(ts_seed(ivec2(px.x, 0), 404u));
  float gDPix = ts_gauss(ts_seed(px, 505u));
  float fpn = uFPN * (0.025 * gCol + 0.012 * gPix + 0.003 * gGain * (T - uTref)
                      + uFFC * (0.08 * gDCol + 0.04 * gDPix));

  // ---- low-frequency non-uniformity: vignetting / housing narcissus + drift gradient (K) ----
  vec2 q = (c - 0.5) * vec2(aSen, 1.0);
  float r2 = dot(q, q) / (0.25 * (aSen * aSen + 1.0));                      // 0 centre, 1 corner
  float lowF = -uVignette * (0.6 + 0.4 * uFFC) * r2
               + uFPN * uFFC * 0.15 * ((c.x - 0.5) + 0.5 * (c.y - 0.5));

  // ---- 14-bit core output (K), then DDE in the temperature domain (boosts noise/FPN like real DDE) ----
  float Ts = T + lowF + fpn + nT;
  float Tbg = Tb + lowF;
  float span = max(uHigh - uLow, 1e-3);
  float clipK = 0.2 * span;                                                 // limit detail -> no big halos
  float Td = Ts + uDDE * clamp(Ts - Tbg, -clipK, clipK);

  // ---- AGC + palette ----
  float x = (Td - uLow) / span;
  x = mix(x, ts_curve(x), uCurveMix);
  vec3 col = ts_palette(x);

  // ---- burned-in OSD: crosshair + palette bar (display px, scaled with the image) ----
  if (uOSD > 0.5) {
    vec2 vmin = max(vec2(0.0), 0.5 * (uViewport.zw - rectPx));             // visible image rect (window px)
    vec2 vmax = min(uViewport.zw, 0.5 * (uViewport.zw + rectPx));
    float sc = (vmax.y - vmin.y) / 512.0;
    vec2 wp = win * uViewport.zw;
    vec2 aq = abs(wp - 0.5 * uViewport.zw);                                 // from image centre
    float lw = max(0.6, 0.75 * sc);
    float gap = 6.0 * sc;
    float len = 22.0 * sc;
    bool hO = aq.y < lw + 1.0 && aq.x > gap - 1.0 && aq.x < len + 1.0;
    bool vO = aq.x < lw + 1.0 && aq.y > gap - 1.0 && aq.y < len + 1.0;
    bool hI = aq.y < lw && aq.x > gap && aq.x < len;
    bool vI = aq.x < lw && aq.y > gap && aq.y < len;
    if (hO || vO) col = mix(col, vec3(0.0), 0.6);                           // dark outline
    if (hI || vI) col = vec3(0.95);
    float bx1 = vmax.x - 10.0 * sc;
    float bx0 = bx1 - 8.0 * sc;
    float by0 = mix(vmin.y, vmax.y, 0.3);
    float by1 = mix(vmin.y, vmax.y, 0.7);
    if (wp.x > bx0 - 1.0 && wp.x < bx1 + 1.0 && wp.y > by0 - 1.0 && wp.y < by1 + 1.0) {
      bool inner = wp.x > bx0 && wp.x < bx1 && wp.y > by0 && wp.y < by1;
      col = inner ? ts_palette((wp.y - by0) / (by1 - by0)) : vec3(0.85);
    }
  }
  fragColor = vec4(col, 1.0);                                               // display-referred, no tone mapping
}
`;

function identityCurve() {
  const c = new Float32Array(17);
  for (let i = 0; i < 17; i++) c[i] = i / 16;
  return c;
}

/** Uniforms for THERMAL_SENSOR_FRAG (defaults ~ FLIR Boson 640, 50 mK NETD class). */
function createThermalSensorUniforms() {
  return {
    uRadiance: { value: null },                        // full-res radiance render target .texture
    uSmall:    { value: null },                        // downsample target .texture (enables halo)
    uViewport: { value: new THREE.Vector4(0, 0, 640, 512) },
    uFill:     { value: 0 },
    uSensorRes:{ value: new THREE.Vector2(640, 512) },
    uZoom:     { value: 1 },
    uFrame:    { value: 0 },
    uLow:      { value: 285 },
    uHigh:     { value: 300 },
    uCurve:    { value: identityCurve() },
    uCurveMix: { value: 0 },
    uNETD:     { value: 0.045 },
    uFPN:      { value: 1 },
    uFFC:      { value: 0 },
    uTref:     { value: 295 },
    uVignette: { value: 0.4 },
    uBlur:     { value: 0.5 },
    uGlow:     { value: 0.04 },
    uDDE:      { value: 0.5 },
    uPalette:  { value: 0 },
    uOSD:      { value: 1 },
  };
}

/** Uniforms for THERMAL_DOWNSAMPLE_FRAG; shares uRadiance/uSensorRes/uZoom objects with the sensor pass
 *  so both passes always see the same FOV. */
function createThermalDownsampleUniforms(sensorUniforms, outW = 80, outH = 64) {
  const u = sensorUniforms || createThermalSensorUniforms();
  return {
    uRadiance: u.uRadiance,
    uSensorRes: u.uSensorRes,
    uZoom: u.uZoom,
    uOutRes: { value: new THREE.Vector2(outW, outH) },
  };
}

// ---------------------------------------------------------------------------------------------
// CPU automatic gain control
// ---------------------------------------------------------------------------------------------
/**
 * Histogram AGC on the small apparent-temperature readback.
 *  - robust tail rejection (default 1 % / 99 %) from a 1024-bin histogram, interpolated within bins
 *  - small margin, minimum span (default 4 K), exponential smoothing of window centre and span
 *    (time constant tau, default 0.7 s; first frame snaps)
 *  - plateau equalisation curve (64 bins, bin counts clipped at `plateau` x mean) as 17 knots,
 *    blended in the shader by `plateauMix` (0 = pure linear AGC)
 */
class ThermalAGC {
  constructor(o = {}) {
    this.width = o.width ?? 80;
    this.height = o.height ?? 64;
    this.stride = o.stride ?? 4;            // RGBA readback
    this.channel = o.channel ?? 0;          // R = apparent K
    this.toKelvin = o.toKelvin ?? null;     // optional fn if the channel holds radiance
    this.tailLow = o.tailLow ?? 0.01;
    this.tailHigh = o.tailHigh ?? 0.99;
    this.margin = o.margin ?? 0.05;         // fraction of the percentile span added on each side
    this.minSpan = o.minSpan ?? 4;          // K
    this.tau = o.tau ?? 0.7;                // s
    this.bins = o.bins ?? 1024;
    this.plateau = o.plateau ?? 2.0;
    this.plateauMix = o.plateauMix ?? 0.0;
    this.roi = o.roi ?? null;               // {x0,y0,x1,y1} normalised (y up), stats region
    this.validMin = o.validMin ?? 100;
    this.validMax = o.validMax ?? 1000;
    this._vals = new Float32Array(this.width * this.height);
    this._hist = new Uint32Array(this.bins);
    this._eq = new Float64Array(64);
    this._target = identityCurve();
    this.reset();
  }

  reset() {
    this.center = NaN;
    this.span = NaN;
    this.curve = identityCurve();
    this.p1 = NaN;
    this.p99 = NaN;
  }

  get low() { return this.center - 0.5 * this.span; }
  get high() { return this.center + 0.5 * this.span; }

  _collect(data) {
    const { width: W, height: H, stride, channel, toKelvin } = this;
    let x0 = 0, x1 = W, y0 = 0, y1 = H;
    if (this.roi) {
      x0 = Math.max(0, Math.floor(this.roi.x0 * W)); x1 = Math.min(W, Math.ceil(this.roi.x1 * W));
      y0 = Math.max(0, Math.floor(this.roi.y0 * H)); y1 = Math.min(H, Math.ceil(this.roi.y1 * H));
    }
    let n = 0, mn = Infinity, mx = -Infinity;
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        let v = data[(y * W + x) * stride + channel];
        if (toKelvin) v = toKelvin(v);
        if (!(v >= this.validMin && v <= this.validMax)) continue;   // rejects NaN too
        this._vals[n++] = v;
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
    }
    return { n, mn, mx };
  }

  /** @param {Float32Array} data readback buffer  @param {number} dt seconds since last update */
  update(data, dt = 1 / 30) {
    const { n, mn, mx } = this._collect(data);
    if (n === 0) return this.result();

    // --- robust percentiles from a histogram over [mn, mx] ---
    const B = this.bins, hist = this._hist;
    hist.fill(0);
    const range = Math.max(mx - mn, 1e-6), bw = range / B;
    for (let i = 0; i < n; i++) hist[Math.min(B - 1, ((this._vals[i] - mn) / bw) | 0)]++;
    const pct = (p) => {
      const target = p * n;
      let cum = 0;
      for (let i = 0; i < B; i++) {
        const h = hist[i];
        if (h > 0 && cum + h >= target) return mn + (i + (target - cum) / h) * bw;
        cum += h;
      }
      return mx;
    };
    this.p1 = pct(this.tailLow);
    this.p99 = pct(this.tailHigh);

    // --- window: margin, minimum span ---
    const s0 = this.p99 - this.p1;
    let lo = this.p1 - this.margin * s0, hi = this.p99 + this.margin * s0;
    const cen = 0.5 * (lo + hi);
    const spn = Math.max(hi - lo, this.minSpan);

    // --- temporal smoothing (first frame snaps) ---
    const a = Number.isFinite(this.center) ? 1 - Math.exp(-Math.max(dt, 0) / this.tau) : 1;
    this.center = Number.isFinite(this.center) ? this.center + a * (cen - this.center) : cen;
    this.span = Number.isFinite(this.span) ? this.span + a * (spn - this.span) : spn;

    // --- plateau equalisation curve on the smoothed window ---
    const eq = this._eq, NB = eq.length, wlo = this.low, wsp = this.span;
    eq.fill(0);
    let nIn = 0;
    for (let i = 0; i < n; i++) {
      const t = (this._vals[i] - wlo) / wsp;
      if (t < 0 || t >= 1) continue;
      eq[(t * NB) | 0]++;
      nIn++;
    }
    const tgt = this._target;
    if (nIn > 0) {
      const clip = Math.max(1, this.plateau * nIn / NB);
      let tot = 0;
      for (let i = 0; i < NB; i++) { eq[i] = Math.min(eq[i], clip); tot += eq[i]; }
      let cum = 0;
      tgt[0] = 0;
      for (let i = 0; i < NB; i++) {
        cum += eq[i];
        if ((i + 1) % (NB / 16) === 0) tgt[(i + 1) / (NB / 16)] = cum / tot;
      }
    } else {
      tgt.set(identityCurve());
    }

// ============================================================================
// Cinematic camera presets (feature module; the lens and post chain are in cine_post.js)
// ============================================================================
// Free orbit / sea level / drone orbit / helicopter overhead / rescue boat POV, with smooth transitions, focal length
// and handheld shake. The preset pose is applied just before the frame is rendered and the orbit camera is restored
// afterwards (cineCamApply / cineCamRestore, called from cine_post.js), so OrbitControls keeps its own state; mouse

  cineShake: false, cineShakeAmt: 0.5,

  pose: { p: new THREE.Vector3(), q: new THREE.Quaternion() },     // pose rendered this frame
  shown: { p: new THREE.Vector3(), q: new THREE.Quaternion() },    // last pose actually shown
  active: false, applied: false,
  heightAboveWater: 3, waterVy: 0, splash: 0,                      // read by the lens droplets
  sea: { init: false, y: 0, vy: 0, n: new THREE.Vector3(0, 1, 0) },
  boat: { init: false, h: 0, vh: 0, p: 0, vp: 0, r: 0, vr: 0 },

HOOKS.lateUpdate.push((dt, dtReal) => {

  cineQuery(CINE_PROBE + 2, bx + fz * 1.25, bz - fx * 1.25); cineQuery(CINE_PROBE + 3, bx - fz * 1.25, bz + fx * 1.25);

      const w = probe(CINE_PROBE + 5), S = C.sea;

// called from cine_post.js just before / after the frame (and the sensor windows) are rendered
function cineCamApply() {
  const C = cineCam, S = C.saved;

  S.p.copy(camera.position); S.q.copy(camera.quaternion);
  S.c.copy(oceanU.uCenter.value); S.xz.copy(skyU.uCamXZ.value); S.dome.copy(skyDome.position);
  camera.position.copy(C.pose.p); camera.quaternion.copy(C.pose.q);
  camera.updateMatrixWorld();
  oceanU.uCenter.value.set(camera.position.x, camera.position.z);
  skyU.uCamXZ.value.set(camera.position.x, camera.position.z);
  skyDome.position.copy(camera.position);

// ===== src/features/cine_post.js =====
// ============================================================================
// Cinematic post-processing and lens (feature module)
// ============================================================================
// Runs inside the final composite pass, so every pass inserted after the RenderPass (composer index 1..) is included:
//   scene depth (captured right after the RenderPass, linearised)
//   -> TAA: Halton(2,3) projection jitter, camera reprojection from depth, YCoCg variance clipping, Catmull-Rom history
//   -> energy-conserving dual-filter bloom (Karis-averaged first downsample, levels mixed into the image, not added)
//   -> auto exposure: centre-weighted log-average luminance, EV clamps, separate brightening/darkening speeds
//   -> depth of field: thin-lens circle of confusion, autofocus, polygonal-aperture gather at half resolution
//   -> composite: camera motion blur, lens water droplets, sharpening, chromatic aberration, bloom, sun ghosts and
//      starburst (occluded by clouds, people and waves), lens dirt, exposure, white balance and grade, AgX, grain.
// The RGB sensor window keeps the basic composite of 01_setup.js (09_sensors.js captured its shader at load time).
Object.assign(params, {
  cineAA: 1, cineSharpen: 0.3,
  cineAutoExp: true, cineAEStrength: 0.75, cineEVMin: -2.0, cineEVMax: 1.5, cineAdaptUp: 3.0, cineAdaptDown: 1.0,
  cineBloom: true,
  cineFlareOn: true, cineFlare: 1.0, cineStarburst: 1.0,
  cineDirtOn: true, cineDirt: 1.0,
  cineCAOn: true, cineCA: 0.5,
  cineGrainOn: true, cineGrain: 0.35,
  cineVignette: 1.0,
  cineDof: true, cineFstop: 2.8, cineAF: 0, cineFocusDist: 16,
  cineMB: true, cineShutter: 180,
  cineDrops: true, cineRainLens: 0,
  cineTemp: 5150, cineTint: 0, cineContrast: 1, cineSat: 1, cineLift: 0, cineGamma: 1, cineGain: 1,

float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

const CINE_LINZ_FRAG = /* glsl */`
uniform sampler2D tDepth;
uniform float uNear, uFar;
layout(location = 0) out vec4 fragColor;
void main() {

const CINE_TAA_FRAG = CINE_COMMON + /* glsl */`
uniform sampler2D tCur, tHist, tZ, tZPrev;
uniform vec2 uRes, uProjK;

uniform float uAlpha, uReset;

vec3 toY(vec3 c) { return vec3(0.25 * c.r + 0.5 * c.g + 0.25 * c.b, 0.5 * c.r - 0.5 * c.b, -0.25 * c.r + 0.5 * c.g - 0.25 * c.b); }

  // match the reprojected depth (moving silhouette, disocclusion), trust the current frame
  float zp = texelFetch(tZPrev, clamp(ivec2(prevUV * uRes), ivec2(0), pmax), 0).r;

uniform sampler2D tSrc, tAdd;

uniform sampler2D tSrc;
uniform float uAspect;

                0.0792237451477643, 0.0791661274605434, 0.879142973793104);

float aperture(vec2 d, float rot) {

// ============================================================================
// Sea condition: the 0-9 sea-state scale (Douglas / WMO code 3700; 中国海况等级 无浪 ... 怒涛)
// ============================================================================
// The scale is defined by the significant height of the wind sea (swell is graded separately), so:
//   - picking a level sets a fully developed wind sea of the middle height of its band: the wind from the
//     Pierson-Moskowitz relation Hs = 0.0248 U10^2 (which also matches the Beaufort force of each level), and
//     the fetch at which this simulator's JONSWAP spectrum reaches that height (gF/U^2 ~ 1.3e4, near full
//     development), whitecap coverage that follows the wind, and a moderate swell that grows with the level;
//   - the level shown is always read back from the wind-sea height of the spectrum actually in use, so changing
//     the wind in the professional panel, or a weather preset, moves it.
// Once a level is picked, weather presets keep the sea (wind and wave height) and only change the sky;
// moving the wind, fetch or wave-height sliders hands control back to them.
const SEA_LEVELS = [
  { name: 'Calm (glassy)', range: '0 m', hs: 0, swell: [0.2, 180],
    desc: 'The sea is like a mirror, or only swell is present.' },
  { name: 'Calm (rippled)', range: '0–0.1 m', hs: 0.06, swell: [0.2, 160],
    desc: 'Ripples, or ripples together with swell.' },
  { name: 'Smooth (wavelets)', range: '0.1–0.5 m', hs: 0.3, swell: [0.3, 150],
    desc: 'Small wavelets; crests begin to break, but the foam looks glassy rather than white.' },
  { name: 'Slight', range: '0.5–1.25 m', hs: 0.88, swell: [0.5, 140],
    desc: 'Waves are small but conspicuous; crests break, with white foam (whitecaps) in places.' },
  { name: 'Moderate', range: '1.25–2.5 m', hs: 1.9, swell: [0.8, 130],
    desc: 'Waves take a pronounced form, with whitecaps everywhere.' },
  { name: 'Rough', range: '2.5–4 m', hs: 3.25, swell: [1.2, 150],
    desc: 'Large crests form; foam covers much of them and the wind starts to blow it off the crests.' },
  { name: 'Very rough', range: '4–6 m', hs: 5, swell: [1.6, 170],
    desc: 'Foam blown off the crests begins to stretch in streaks down the wave faces; crests sometimes take the long shape of storm waves.' },
  { name: 'High', range: '6–9 m', hs: 7.5, swell: [2.0, 190],
    desc: 'Streaks of blown foam cover the wave faces and reach into some troughs; the crests are covered in foam.' },
  { name: 'Very high', range: '9–14 m', hs: 11.5, swell: [2.5, 220],
    desc: 'Dense foam covers the wave faces and the sea turns white; only parts of the troughs are free of foam.' },
  { name: 'Phenomenal', range: '> 14 m', hs: 16, swell: [3.0, 250],
    desc: 'The whole sea is covered in dense foam, the air is full of spray and visibility is much reduced.' },

Object.assign(params, { seaState: 4, seaLock: false });

const seaLevelOf = hs => { let l = 0; while (l < SEA_EDGES.length && hs >= SEA_EDGES[l]) l++; return l; };

//     optics with the LEAN slope covariance, Fresnel R(0) ~ 0.02), plus a tiny volume term. At grazing angles
//     almost nothing comes back. Near nadir the glints are strong and flicker from shot to shot (exponential
//     speckle);

//   - people and gear: Lambertian reflectance per material at the laser wavelength:

//       retroreflective SOLAS tape returns ~1000x a white card at normal incidence, saturates the receiver and

// ============================================================================
// LiDAR file formats: PCD (binary / ASCII), LAS 1.2 and LAZ (LASzip-compressed LAS)
// ============================================================================
// LAS 1.2, point data format 1: x y z (mm), intensity, return number / number of returns, classification, scan angle,
// user data, point source id, GPS time. LAZ: LASzip "pointwise chunked" compression (POINT10 v2 + GPSTIME11 v2 items,
// 50 000 points per chunk), the layout LAStools / laszip write for LAS 1.2, read by PDAL, CloudCompare, laspy, QGIS.
// Field mapping:
//   intensity       = apparent reflectance x 32768, clamped (a white Lambertian card ~32768, retroreflectors 65535)
//   classification  = ASPRS codes: 9 water (and foam), 7 noise (fog / rain / spray clutter, blooming),
//                     1 unclassified (objects); user-defined 19 person, 20 retroreflector
//   user data       = the simulator's own label (1 water 2 foam 3 person 4 retroreflector 5 object 6 clutter 7 blooming)
//   point source id = frame number;  GPS time = simulation time of the pulse (s)
//   scan angle      = horizontal angle of the beam from the sensor's forward axis (deg, clamped to +-90)
// The LASzip coder is a JavaScript port of the encoder side of LASzip, Copyright (C) Martin Isenburg / rapidlasso GmbH,
// Apache License 2.0 (arithmetic coder after Amir Said's FastAC): arithmeticencoder, arithmeticmodel,
// integercompressor, laswriteitemcompressed_v2 (POINT10, GPSTIME11) and laswritepoint (chunks and chunk table).
// The whole library is one self-contained function so the same source also runs in background workers.
