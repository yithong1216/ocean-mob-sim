<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean MOB Simulator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
               font-family: "Segoe UI", system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
  .lil-gui { --font-family: -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; top: 12px; max-width: 340px; pointer-events: none;
    color: #e6f0f4; background: rgba(5, 14, 22, 0.5); backdrop-filter: blur(6px);
    padding: 10px 13px; border-radius: 8px; font-size: 12px; line-height: 1.55;
  }
  #hud h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  #hud .k { color: #93aebb; }
  #hud .hint { margin-top: 6px; color: #93aebb; font-size: 11px; }
  .sensor { position: fixed; bottom: 12px; pointer-events: none; border: 1px solid rgba(190, 215, 225, 0.55);
            border-radius: 3px; box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45); font: 11px/1.3 Consolas, "Cascadia Mono", "Microsoft YaHei", "PingFang SC", monospace; color: #e8f4f8; }
  .sensor .t { position: absolute; left: 0; top: 0; right: 0; padding: 4px 7px; display: flex; justify-content: space-between;
               background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0)); text-shadow: 0 0 3px #000; }
  .sensor .b { position: absolute; left: 0; bottom: 0; right: 0; padding: 4px 7px; display: flex; justify-content: space-between;
               background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.5)); text-shadow: 0 0 3px #000; }
  .sensor .rec { color: #ff6b5a; }
  #err { position: fixed; left: 12px; bottom: 12px; right: 12px; color: #ffd2d2; background: rgba(80, 0, 0, .8);
         padding: 8px 10px; border-radius: 6px; font: 12px monospace; white-space: pre-wrap; display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="hud"><h1 data-i18n="Ocean · persons in water">Ocean · persons in water</h1><div id="stats">loading…</div>
  <div class="hint" data-i18n="Drag to orbit · wheel to zoom · right-drag to pan">Drag to orbit · wheel to zoom · right-drag to pan</div></div>
<div id="err"></div>
<div class="sensor" id="winRGB"><div class="t"><span data-i18n="EO · RGB">EO · RGB</span><span class="rec" data-i18n="● REC">● REC</span></div><div class="b"><span id="osdRGB"></span><span></span></div></div>
<div class="sensor" id="winIR"><div class="t"><span data-i18n="LWIR 8–14 µm">LWIR 8–14 µm</span><span id="osdPal"></span></div><div class="b"><span id="osdIR"></span><span id="osdSpan"></span></div></div>
<script>
  window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || e) + '\n'; });
  window.addEventListener('unhandledrejection', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += 'Promise: ' + (e.reason && e.reason.message || e.reason) + '\n'; });
</script>
<script type="module">
/*@BUNDLE@*/
</script>
</body>
</html>
